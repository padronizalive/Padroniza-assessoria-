<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Encontre Seu Oponente — Padroniza Live</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top left, #5b2cff, #0b1020 40%, #02101f 70%, #c79b3b 100%);
      --primary-purple: #7b3fff;
      --primary-gold: #c79b3b;
      --primary-blue: #1f7aff;
      --primary-green: #22c55e;
      --primary-red: #ef4444;
      --text-light: #f5f5ff;
      --text-muted: #b3b3cc;
      --card-bg: rgba(255,255,255,0.05);
      --card-border: rgba(255,255,255,0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-light);
      padding: 20px;
    }

    .container { max-width: 900px; margin: 0 auto; }
    
    .header {
      text-align: center;
      margin-bottom: 30px;
      position: relative;
    }

    .btn-voltar {
      position: absolute;
      left: 0;
      top: 0;
      background: rgba(255,255,255,0.1);
      border: 1px solid var(--card-border);
      color: var(--text-light);
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
      transition: all 0.3s;
    }
    .btn-voltar:hover { background: rgba(123,63,255,0.3); }

    h1 { font-size: 2rem; margin-bottom: 8px; background: linear-gradient(90deg, #fff, var(--primary-gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subtitulo { color: var(--text-muted); font-size: 1rem; }
    .resumo { text-align: center; margin: 10px 0 20px; color: var(--text-muted); font-size: 0.95rem; }
    .resumo span { color: var(--primary-green); font-weight: 700; }

    .botoes-topo {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 24px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primario { background: linear-gradient(135deg, var(--primary-purple), #6b2fef); color: white; box-shadow: 0 4px 15px rgba(123,63,255,0.3); }
    .btn-primario:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(123,63,255,0.4); }
    .btn-sucesso { background: linear-gradient(135deg, var(--primary-green), #16a34a); color: white; }
    .btn-perigo { background: linear-gradient(135deg, var(--primary-red), #dc2626); color: white; }
    .btn-whatsapp { background: linear-gradient(135deg, #25d366, #128c7e); color: white; font-size: 0.9rem; padding: 8px 14px; }
    .btn-whatsapp:hover { transform: scale(1.05); }
    .btn-secundario { background: rgba(255,255,255,0.1); border: 1px solid var(--card-border); color: white; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
    }
    .card:hover { border-color: var(--primary-purple); transform: translateY(-3px); }

    .status-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .status-disponivel { background: rgba(34,197,94,0.2); color: #22c55e; border: 1px solid #22c55e; }
    .status-pendente { background: rgba(251,191,36,0.2); color: #fbbf24; border: 1px solid #fbbf24; }
    .status-respondida { background: rgba(251,146,60,0.2); color: #fb923c; border: 1px solid #fb923c; }
    .status-fechado { background: rgba(239,68,68,0.2); color: #ef4444; border: 1px solid #ef4444; }

    .grid-dados {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }
    .campo { display: flex; flex-direction: column; gap: 4px; }
    .campo label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    .campo span { font-size: 1rem; font-weight: 500; word-break: break-all; }
    .campo a { color: var(--primary-blue); text-decoration: none; }
    .campo a:hover { text-decoration: underline; }

    .aviso-status {
      background: rgba(239,68,68,0.08);
      border-left: 3px solid var(--primary-red);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.9rem;
    }
    .aviso-status h4 {
      color: var(--primary-red);
      margin-bottom: 8px;
      font-size: 0.95rem;
    }
    .aviso-status ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .aviso-status li {
      padding: 4px 0;
      font-size: 0.85rem;
      color: var(--text-light);
    }
    .aviso-status li span { font-weight: 700; }

    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; color: var(--text-muted); font-size: 0.9rem; }
    input, select, textarea {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: rgba(255,255,255,0.05);
      color: var(--text-light);
      font-size: 1rem;
      outline: none;
      transition: border 0.3s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--primary-purple); }
    textarea { resize: vertical; min-height: 80px; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-aberto { display: flex; }
    .modal {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 30px;
      max-width: 520px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal h2 { margin-bottom: 20px; color: var(--primary-gold); }
    .fechar-modal {
      float: right;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
      margin-top: -10px;
    }

    .acoes { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
    .sem-batalhas { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .loading { text-align: center; padding: 40px; }
    .erro { background: rgba(239,68,68,0.1); border: 1px solid #ef4444; color: #fca5a5; padding: 12px; border-radius: 8px; margin-bottom: 20px; }
    .sucesso { background: rgba(34,197,94,0.1); border: 1px solid #22c55e; color: #86efac; padding: 12px; border-radius: 8px; margin-bottom: 20px; }

    .divisor { height: 1px; background: var(--card-border); margin: 20px 0; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <a href="/" class="btn-voltar">← Voltar ao Site</a>
    <h1>⚔️ Encontre Seu Oponente</h1>
    <p class="subtitulo">Padroniza Live — Sistema de Batalhas</p>
  </div>

  <div class="botoes-topo">
    <button class="btn btn-primario" onclick="abrirFormulario()">📋 Nova Solicitação</button>
    <button class="btn btn-secundario" onclick="carregarBatalhas()">🔄 Atualizar</button>
  </div>

  <div id="resumo" class="resumo"></div>
  <div id="mensagens"></div>
  <div id="lista-batalhas"></div>
</div>
