<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- ✅ SEO — APARECE NA PESQUISA E AO COMPARTILHAR 🔍 -->
<title>Encontre Seu Oponente — Padroniza Assessoria | Plataforma Gratuita</title>
<meta name="description" content="🎮 Plataforma gratuita de parcerias e batalhas entre agências. Encontre seu oponente oficial gratuitamente com a Padroniza Assessoria!">
<meta name="keywords" content="encontre oponente, batalha oficial, parceria entre agências, Padroniza Assessoria, plataforma gratuita">
<meta name="author" content="Padroniza Assessoria">
<meta property="og:title" content="Encontre Seu Oponente — Padroniza Assessoria">
<meta property="og:description" content="Plataforma gratuita de batalhas entre agências! 🎮⚔️">
<meta property="og:type" content="website">
<meta name="twitter:title" content="Encontre Seu Oponente — Padroniza Assessoria">
<meta name="twitter:description" content="Plataforma gratuita de batalhas entre agências! 🎮⚔️">

<style>
:root{--fundo:#0b1020;--painel:#11182c;--painel2:#17213a;--verde:#34d399;--amarelo:#ffc857;--vermelho:#ef4444;--rosa:#ff3d81;--roxo:#7457ff;--azul:#3b82f6;--texto:#f7f9ff;--cinza:#a9b4cb}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:var(--fundo);color:var(--texto);min-height:100vh;padding:15px}
.container{max-width:650px;margin:0 auto}

.cabecalho{text-align:center;margin-bottom:25px}
.logo-topo{width:120px;height:auto;margin-bottom:10px;border-radius:12px;border:2px solid var(--amarelo)}
.cabecalho h1{font-size:26px;color:var(--amarelo);margin-bottom:5px}
.cabecalho p{font-size:15px;color:var(--cinza)}

.botao-voltar{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--painel2);color:var(--texto);border:none;
  padding:10px 16px;border-radius:8px;cursor:pointer;
  text-decoration:none;font-size:15px;margin-bottom:20px;
  transition:0.2s;border:1px solid #293653
}
.botao-voltar:hover{background:var(--painel)}

.form-card{background:var(--painel);padding:25px;border-radius:14px;border:1px solid #293653;margin-bottom:25px}
.form-card h2{color:var(--verde);margin-bottom:20px;font-size:20px;text-align:center}
.grupo-campo{margin-bottom:16px}
.label{display:block;margin-bottom:8px;font-size:14px;color:#ccc}
.campo{width:100%;padding:13px 15px;background:var(--painel2);border:1px solid #293653;border-radius:8px;color:var(--texto);font-size:15px}
.campo:focus{outline:none;border-color:var(--verde)}
select.campo{appearance:none;background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23a9b4cb'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 15px center;background-size:18px}

.btn-enviar{
  width:100%;padding:15px;background:linear-gradient(135deg,var(--verde),#22c55e);
  border:none;border-radius:10px;color:#000;font-weight:bold;font-size:17px;
  cursor:pointer;transition:0.2s
}
.btn-enviar:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(52,211,153,0.35)}

.lista-solicitacoes{margin-top:30px}
.lista-solicitacoes h2{color:var(--azul);margin-bottom:15px;font-size:20px}
.solicitacao-card{
  background:var(--painel);border:1px solid #293653;border-radius:12px;
  padding:18px;margin-bottom:15px;transition:0.2s
}
.solicitacao-card:hover{border-color:var(--azul)}
.solicitacao-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.agencia-nome{font-weight:bold;font-size:17px;color:var(--amarelo)}
.status-tag{
  padding:4px 10px;border-radius:12px;font-size:12px;font-weight:bold
}
.status-pendente{background:rgba(255,200,87,0.15);color:var(--amarelo)}
.status-aprovado{background:rgba(52,211,153,0.15);color:var(--verde)}
.status-recusado{background:rgba(239,68,68,0.15);color:var(--vermelho)}

.solicitacao-dados p{margin:6px 0;font-size:14px;color:#ddd}
.solicitacao-dados strong{color:var(--texto)}

.btn-responder{
  display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(90deg,#25d366,#128c7e);color:#fff;
  border:none;padding:10px 16px;border-radius:8px;font-weight:bold;
  cursor:pointer;text-decoration:none;font-size:14px;margin-top:12px;
  transition:0.2s
}
.btn-responder:hover{transform:translateY(-2px)}

.sem-dados{text-align:center;padding:40px;color:var(--cinza);font-size:15px}
.aviso-topo{
  background:rgba(116,87,255,0.1);border:1px solid var(--roxo);
  padding:14px;border-radius:10px;margin-bottom:20px;text-align:center
}
.aviso-topo strong{color:var(--roxo)}

.carregando{text-align:center;padding:30px;color:var(--cinza)}
</style>
</head>
<body>
<div class="container">

  <a href="index.html" class="botao-voltar">← Voltar ao Portal</a>

  <div class="cabecalho">
    <img src="https://i.imgur.com/yaTLVi3.jpeg" alt="Padroniza Assessoria" class="logo-topo" loading="lazy">
    <h1>Encontre Seu Oponente</h1>
    <p>Padroniza Assessoria — Plataforma Gratuita de Batalhas 🤝⚔️</p>
  </div>

  <div class="aviso-topo">
    💡 <strong>Como funciona:</strong> Preencha os dados da sua solicitação. Outras agências verão e entrarão em contato pelo WhatsApp!
  </div>

  <div class="form-card">
    <h2>📤 Solicitar Batalha</h2>
    <form id="formSolicitacao">
      <div class="grupo-campo">
        <label class="label">🏢 Nome da Sua Agência</label>
        <input type="text" class="campo" id="nomeAgencia" placeholder="Ex: Padroniza Assessoria" required>
      </div>
      <div class="grupo-campo">
        <label class="label">👤 Nome do Streamer</label>
        <input type="text" class="campo" id="nomeStreamer" placeholder="Ex: @igorcosta" required>
      </div>
      <div class="grupo-campo">
        <label class="label">📅 Data Desejada</label>
        <input type="date" class="campo" id="dataBatalha" required>
      </div>
      <div class="linha-dupla" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="grupo-campo">
          <label class="label">🕐 Horário</label>
          <input type="time" class="campo" id="horario" required>
        </div>
        <div class="grupo-campo">
          <label class="label">🔥 Round</label>
          <input type="number" class="campo" id="round" placeholder="1, 2, 3..." min="1" required>
        </div>
      </div>
      <div class="grupo-campo">
        <label class="label">💎 Meta de Diamantes / Hold</label>
        <input type="text" class="campo" id="meta" placeholder="Ex: 5k, 10k, 5 a 10k" required>
      </div>
      <div class="grupo-campo">
        <label class="label">📱 Seu WhatsApp (com DDD)</label>
        <input type="tel" class="campo" id="whatsapp" placeholder="Ex: 69981478873" required>
      </div>
      <div class="grupo-campo">
        <label class="label">📝 Observações adicionais</label>
        <textarea class="campo" id="observacoes" rows="3" placeholder="Ex: Batalha oficial, live de aniversário, etc..."></textarea>
      </div>
      <button type="submit" class="btn-enviar">📤 ENVIAR SOLICITAÇÃO</button>
    </form>
  </div>

  <div class="lista-solicitacoes">
    <h2>📋 Solicitações de Batalha</h2>
    <div id="listaSolicitacoes" class="carregando">🔄 Carregando solicitações...</div>
  </div>

</div>

<script>
const LINK_APPSCRIPT = "https://script.google.com/macros/s/AKfycbwNtXL2A5ekc5TDy9FTBk4xSttqLRU4bLSSi5N2i4UUwJFpp3aYQUYNBCJt7QEbC0Ww/exec";

async function carregarSolicitacoes(){
  try{
    const res = await fetch(LINK_APPSCRIPT + "?acao=lerSolicitacoes");
    const dados = await res.json();
    const lista = document.getElementById("listaSolicitacoes");
    
    if(!dados.sucesso || !dados.dados.length){
      lista.innerHTML = '<div class="sem-dados">📭 Nenhuma solicitação encontrada. Seja o primeiro a solicitar! ⚔️</div>';
      return;
    }
    
    lista.innerHTML = dados.dados.map(item => {
      const status = (item.status || "Pendente").trim();
      let classeStatus = "status-pendente";
      if(status.toLowerCase().includes("aprovado")) classeStatus = "status-aprovado";
      if(status.toLowerCase().includes("recusado")) classeStatus = "status-recusado";
      
      const dataFormatada = item.data ? new Date(item.data + "T00:00:00").toLocaleDateString('pt-BR') : "Sem data";
      
      const mensagem = encodeURIComponent(
        `⚔️ PROPOSTA DE BATALHA — ${item.nomeAgencia || "Agência"}\n\n` +
        `👤 Streamer: ${item.nomeStreamer || "-"}\n` +
        `📅 Data: ${dataFormatada}\n` +
        `🕐 Horário: ${item.horario || "-"}\n` +
        `🔥 Round: ${item.round || "-"}\n` +
        `💎 Meta/Hold: ${item.meta || "-"}\n` +
        `📝 Obs: ${item.observacoes || "Nenhuma"}\n\n` +
        `👉 Olá! Tenho interesse em marcar essa batalha. Vamos conversar? 🤝`
      );
      
      return `
        <div class="solicitacao-card">
          <div class="solicitacao-header">
            <span class="agencia-nome">🏢 ${escapar(item.nomeAgencia || "Agência")}</span>
            <span class="status-tag ${classeStatus}">${escapar(status)}</span>
          </div>
          <div class="solicitacao-dados">
            <p><strong>Streamer:</strong> ${escapar(item.nomeStreamer || "-")}</p>
            <p><strong>Data:</strong> ${dataFormatada}</p>
            <p><strong>Horário:</strong> ${escapar(item.horario || "-")}</p>
            <p><strong>Round:</strong> ${escapar(item.round || "-")}</p>
            <p><strong>Meta:</strong> ${escapar(item.meta || "-")}</p>
            ${item.observacoes ? `<p><strong>Obs:</strong> ${escapar(item.observacoes)}</p>` : ""}
          </div>
          <a href="https://wa.me/${item.whatsapp || ""}?text=${mensagem}" target="_blank" class="btn-responder">💬 Responder pelo WhatsApp</a>
        </div>
      `;
    }).join("");
    
  }catch(e){
    console.error("Erro ao carregar:", e);
    document.getElementById("listaSolicitacoes").innerHTML = '<div class="sem-dados">⚠️ Erro ao carregar. Tente novamente mais tarde.</div>';
  }
}

document.getElementById("formSolicitacao").addEventListener("submit", async function(e){
  e.preventDefault();
  const btn = this.querySelector("button[type='submit']");
  const textoOriginal = btn.textContent;
  btn.textContent = "Enviando...";
  btn.disabled = true;
  
  const dados = {
    acao: "inserirSolicitacao",
    nomeAgencia: document.getElementById("nomeAgencia").value.trim(),
    nomeStreamer: document.getElementById("nomeStreamer").value.trim(),
    dataBatalha: document.getElementById("dataBatalha").value,
    horario: document.getElementById("horario").value,
    round: document.getElementById("round").value,
    meta: document.getElementById("meta").value.trim(),
    whatsapp: document.getElementById("whatsapp").value.replace(/\D/g, ""),
    observacoes: document.getElementById("observacoes").value.trim()
  };
  
  try{
    await fetch(LINK_APPSCRIPT, {
      method: "POST",
      mode: "no-cors",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(dados)
    });
    
    alert("✅ Solicitação enviada com sucesso! Outras agências já podem ver! 🎉");
    this.reset();
    carregarSolicitacoes();
    
  }catch(erro){
    alert("✅ Solicitação enviada! Atualizando lista...");
    this.reset();
    carregarSolicitacoes();
  }
  
  btn.textContent = textoOriginal;
  btn.disabled = false;
});

function escapar(texto){
  if(!texto) return "";
  const div = document.createElement("div");
  div.textContent = texto;
  return div.innerHTML;
}

document.addEventListener("DOMContentLoaded", carregarSolicitacoes);
</script>
</body>
</html>
