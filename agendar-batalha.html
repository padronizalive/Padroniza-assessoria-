<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Batalhas — Padroniza Assessoria</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        :root {
            --fundo-pagina: #0f0f1a;
            --fundo-card: #1a1a2e;
            --fundo-calendario: #16162a;
            --campanha-fundo: #8a7500; --campanha-borda: #ffd700; --campanha-texto: #fff;
            --oponente-fundo: #004488; --oponente-borda: #00a8ff; --oponente-texto: #fff;
            --confirmada-fundo: #005533; --confirmada-borda: #00ff9c; --confirmada-texto: #fff;
            --domingo-fundo: #661a1a; --domingo-borda: #ff4444; --domingo-texto: #ff8888;
            --dia-vazio: #252540; --texto-dia: #ddd;
        }
        body { background: var(--fundo-pagina); color: #fff; min-height: 100vh; padding: 16px; }
        .container { max-width: 95%; margin: 0 auto; }
        .cabecalho-usuario { background: linear-gradient(135deg, #1a1a2e, #252542); padding: 20px; border-radius: 14px; margin-bottom: 20px; border: 2px solid var(--confirmada-borda); text-align: center; }
        .logo { font-size: 24px; font-weight: bold; background: linear-gradient(90deg, var(--confirmada-borda), var(--oponente-borda)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .logo::before { content: "⚔️"; font-size: 26px; }
        .nome-usuario { font-size: 22px; font-weight: bold; color: var(--confirmada-borda); margin: 8px 0; }
        .data-hoje { font-size: 14px; color: #888; }
        .minhas-batalhas { background: var(--fundo-card); padding: 20px; border-radius: 14px; margin-bottom: 20px; border: 2px solid var(--confirmada-borda); }
        .titulo-secao { font-size: 18px; font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .titulo-secao.minhas::before { content: "👤"; font-size: 20px; }
        .lista-vazia { color: #888; font-size: 14px; padding: 18px; text-align: center; }
        .lista-itens { display: flex; flex-direction: column; gap: 10px; }
        .item-card { padding: 12px 14px; border-radius: 10px; border-left: 4px solid; background: rgba(255,255,255,0.03); }
        .item-campanha { border-color: var(--campanha-borda); }
        .item-oponente { border-color: var(--oponente-borda); }
        .item-confirmada { border-color: var(--confirmada-borda); }
        .cabecalho-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; flex-wrap: wrap; gap: 6px; }
        .etiqueta { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: bold; }
        .item-campanha .etiqueta { background: rgba(255,215,0,0.2); color: var(--campanha-borda); }
        .item-oponente .etiqueta { background: rgba(0,168,255,0.2); color: var(--oponente-borda); }
        .item-confirmada .etiqueta { background: rgba(0,255,156,0.2); color: var(--confirmada-borda); }
        .nome-batalha { font-size: 15px; font-weight: bold; margin: 4px 0; }
        .detalhes-item { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: #aaa; margin-top: 2px; }
        .detalhes-item a { color: var(--oponente-borda); text-decoration: none; }
        .data-item { display: flex; align-items: center; gap: 4px; font-size: 13px; color: #aaa; }
        .calendario { background: var(--fundo-calendario); padding: 20px; border-radius: 14px; margin-bottom: 20px; border: 2px solid #2a2a4e; }
        .titulo-calendario { font-size: 18px; font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .titulo-calendario::before { content: "📅"; font-size: 20px; }
        .navegacao-mes { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-nav { background: transparent; border: 2px solid var(--confirmada-borda); color: var(--confirmada-borda); padding: 10px 16px; border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: bold; }
        .btn-nav:hover { background: rgba(0,255,156,0.1); }
        .nome-mes { font-size: 22px; font-weight: bold; text-align: center; flex: 1; }
        .dias-semana { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 10px; }
        .dia-semana { text-align: center; font-size: 14px; color: #aaa; padding: 8px; font-weight: 600; }
        .grade-dias { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        .dia { aspect-ratio: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 10px; font-size: 16px; font-weight: bold; background: var(--dia-vazio); color: var(--texto-dia); border: 2px solid transparent; }
        .dia.vazio { background: transparent; border: none; }
        .dia.campanha { background: var(--campanha-fundo); border: 3px solid var(--campanha-borda); color: var(--campanha-texto); }
        .dia.falta-oponente { background: var(--oponente-fundo); border: 3px solid var(--oponente-borda); color: var(--oponente-texto); }
        .dia.confirmada { background: var(--confirmada-fundo); border: 3px solid var(--confirmada-borda); color: var(--confirmada-texto); }
        .dia.domingo-feriado { background: var(--domingo-fundo); border: 3px solid var(--domingo-borda); color: var(--domingo-texto); }
        .dia.hoje { box-shadow: 0 0 0 3px #fff; }
        .status-mini { font-size: 10px; margin-top: 2px; font-weight: bold; line-height: 1; }
        .legenda { background: var(--fundo-card); padding: 16px; border-radius: 12px; margin-bottom: 24px; }
        .legenda h3 { margin-bottom: 12px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
        .legenda h3::before { content: "📋"; }
        .legenda-itens { display: flex; flex-wrap: wrap; gap: 20px; }
        .item-legenda { display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .cor { width: 20px; height: 20px; border-radius: 4px; border: 2px solid; }
        .cor.campanha { background: var(--campanha-fundo); border-color: var(--campanha-borda); }
        .cor.oponente { background: var(--oponente-fundo); border-color: var(--oponente-borda); }
        .cor.confirmada { background: var(--confirmada-fundo); border-color: var(--confirmada-borda); }
        .cor.domingo { background: var(--domingo-fundo); border-color: var(--domingo-borda); }
        .agencia { margin-top: 10px; }
        .titulo-secao-agencia { font-size: 20px; font-weight: bold; border-bottom: 2px solid #2a2a4e; padding-bottom: 12px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .titulo-secao-agencia::before { content: "🌍"; font-size: 22px; }
        .secao-agencia { background: var(--fundo-card); padding: 18px; border-radius: 12px; margin-bottom: 16px; }
        .subtitulo-agencia { font-size: 15px; font-weight: bold; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; color: #ccc; }
        .subtitulo-agencia.camp::before { content: "📢"; }
        .subtitulo-agencia.conf::before { content: "✅"; }
        .subtitulo-agencia.falta::before { content: "⏳"; }
        @media(max-width:600px) { .dia { font-size: 14px; } .status-mini { font-size: 9px; } .nome-mes { font-size: 18px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="cabecalho-usuario">
            <h1 class="logo">Padroniza Assessoria</h1>
            <div class="nome-usuario">👤 Streamer: <span id="nomeUsuario">VISITANTE</span></div>
            <div class="data-hoje">📅 Hoje: <span id="dataHoje"></span></div>
        </div>
        <div class="minhas-batalhas">
            <h2 class="titulo-secao minhas">📋 Minhas Batalhas</h2>
            <div id="minhasBatalhas" class="lista-itens"><div class="lista-vazia">📭 Carregando...</div></div>
        </div>
        <div class="calendario">
            <h2 class="titulo-calendario">📅 Calendário de Batalhas</h2>
            <div class="navegacao-mes">
                <button class="btn-nav" id="btnMesAnterior">◀</button>
                <h2 class="nome-mes" id="nomeMes"></h2>
                <button class="btn-nav" id="btnProximoMes">▶</button>
            </div>
            <div class="dias-semana"><div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div></div>
            <div class="grade-dias" id="gradeDias"></div>
        </div>
        <div class="legenda">
            <h3>Legenda</h3>
            <div class="legenda-itens">
                <div class="item-legenda"><div class="cor campanha"></div> Campanha</div>
                <div class="item-legenda"><div class="cor oponente"></div> Falta Oponente</div>
                <div class="item-legenda"><div class="cor confirmada"></div> Confirmada</div>
                <div class="item-legenda"><div class="cor domingo"></div> Domingo/Feriado</div>
            </div>
        </div>
        <div class="agencia">
            <h2 class="titulo-secao-agencia">🌍 Agenda da Agência</h2>
            <div class="secao-agencia"><h3 class="subtitulo-agencia camp">📢 Campanhas</h3><div id="todasCampanhas" class="lista-itens"><div class="lista-vazia">📭 Vazio</div></div></div>
            <div class="secao-agencia"><h3 class="subtitulo-agencia conf">✅ Confirmadas</h3><div id="todasConfirmadas" class="lista-itens"><div class="lista-vazia">📭 Vazio</div></div></div>
            <div class="secao-agencia"><h3 class="subtitulo-agencia falta">⏳ Falta Oponente</h3><div id="todasFaltaOponente" class="lista-itens"><div class="lista-vazia">📭 Vazio</div></div></div>
        </div>
    </div>
<script>
const FERIADOS = {"01-01":"Confraternização Universal","03-04":"Carnaval","04-10":"Paixão de Cristo","04-21":"Tiradentes","05-01":"Dia do Trabalho","06-19":"Corpus Christi","09-07":"Independência","10-12":"Nossa Senhora Aparecida","11-02":"Finados","11-15":"Proclamação da República","12-25":"Natal"};
let dataAtual = new Date(), batalhas = [], nomeUsuario = "VISITANTE";

document.addEventListener("DOMContentLoaded", async () => {
    const params = new URLSearchParams(window.location.search);
    nomeUsuario = (params.get("streamer") || "VISITANTE").toUpperCase().trim();
    document.getElementById("nomeUsuario").textContent = nomeUsuario;
    const hoje = new Date();
    document.getElementById("dataHoje").textContent = `${String(hoje.getDate()).padStart(2,"0")}/${String(hoje.getMonth()+1).padStart(2,"0")}/${hoje.getFullYear()}`;
    atualizarNomeMes();
    await carregarBatalhas();
    renderizarTudo();
    document.getElementById("btnMesAnterior").onclick = () => { dataAtual.setMonth(dataAtual.getMonth()-1); renderizarTudo(); };
    document.getElementById("btnProximoMes").onclick = () => { dataAtual.setMonth(dataAtual.getMonth()+1); renderizarTudo(); };
});

function atualizarNomeMes() {
    const nomes = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
    document.getElementById("nomeMes").textContent = `${nomes[dataAtual.getMonth()]} ${dataAtual.getFullYear()}`;
}

function normalizarData(data) {
    if (!data) return "";
    if (data instanceof Date && !isNaN(data.getTime())) return `${data.getFullYear()}-${String(data.getMonth()+1).padStart(2,"0")}-${String(data.getDate()).padStart(2,"0")}`;
    const s = String(data).trim();
    if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)) { const [d,m,a]=s.split("/"); return `${a}-${String(parseInt(m)).padStart(2,"0")}-${String(parseInt(d)).padStart(2,"0")}`; }
    if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)) { const [a,m,d]=s.split("-"); return `${a}-${String(parseInt(m)).padStart(2,"0")}-${String(parseInt(d)).padStart(2,"0")}`; }
    const d = new Date(s); if (!isNaN(d.getTime())) return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    return "";
}

function getSituacao(b) {
    if (!b.situacao) return "CONFIRMADA";
    const sit = String(b.situacao).toUpperCase().trim();
    if (sit.includes("CAMPANHA")) return "CAMPANHA";
    if (sit.includes("FALTA OPONENTE")) return "FALTA OPONENTE";
    return "CONFIRMADA";
}

function ordenarPorData(a,b) { const da=normalizarData(a.data), db=normalizarData(b.data); return da<db?-1:da>db?1:0; }

async function carregarBatalhas() {
    try {
        const res = await new Promise((sucesso, falha) => {
            google.script.run.withSuccessHandler(sucesso).withFailureHandler(falha).buscarBatalhas();
        });
        if (res.status === "sucesso" && Array.isArray(res.batalhas)) {
            batalhas = res.batalhas.slice(1).map(l => ({
                data: l[1] || l[0], horaInicio: l[2] || "", streamer: String(l[6]||"").trim().toUpperCase(),
                oponente: String(l[5]||"").trim().toUpperCase(), situacao: String(l[8]||"").trim().toUpperCase(),
                meta: String(l[16]||"").trim(), link: String(l[12]||"").trim()
            }));
        }
    } catch(e) { console.error("Erro:", e); }
}

function renderizarTudo() { atualizarNomeMes(); renderizarMinhasBatalhas(); renderizarCalendario(); renderizarAgencia(); }
function formatarDataExibir(d) { const n=normalizarData(d); if(!n)return d; const [a,m,dd]=n.split("-"); return `${dd}/${m}/${a}`; }

function renderizarMinhasBatalhas() {
    const minhas = batalhas.filter(b => !b.streamer || nomeUsuario === "VISITANTE" || b.streamer.includes(nomeUsuario));
    minhas.sort(ordenarPorData);
    document.getElementById("minhasBatalhas").innerHTML = minhas.length ? minhas.map(montarCard).join("") : `<div class="lista-vazia">📭 Nenhuma batalha no seu nome.</div>`;
}

function montarCard(b) {
    const sit = getSituacao(b);
    let classe="", etiqueta="", icone="";
    if (sit==="CAMPANHA") { classe="item-campanha"; etiqueta="CAMPANHA"; icone="📢"; }
    else if (sit==="FALTA OPONENTE") { classe="item-oponente"; etiqueta="FALTA OPONENTE"; icone="⏳"; }
    else { classe="item-confirmada"; etiqueta="CONFIRMADA"; icone="✅"; }
    const op = b.oponente || "???";
    return `<div class="item-card ${classe}"><div class="cabecalho-item"><span class="data-item">📅 ${formatarDataExibir(b.data)} — ${b.horaInicio||"--:--"}</span><span class="etiqueta">${icone} ${etiqueta}</span></div><div class="nome-batalha">🎥 ${b.streamer||"—"} ⚔️ ${op}</div>${b.meta||b.link?`<div class="detalhes-item">${b.meta?`<span>💎 Meta: ${b.meta}</span>`:""}${b.link?`<a href="${b.link}" target="_blank">🔗 Perfil</a>`:""}</div>`:""}</div>`;
}

function renderizarCalendario() {
    const ano = dataAtual.getFullYear(), mes = dataAtual.getMonth();
    const priDia = new Date(ano, mes, 1).getDay(), totalDias = new Date(ano, mes+1, 0).getDate();
    const hoje = new Date(), hojeStr = `${ano}-${String(mes+1).padStart(2,"0")}-${String(hoje.getDate()).padStart(2,"0")}`;
    let html = "";
    for (let i=0; i<priDia; i++) html += `<div class="dia vazio"></div>`;
    for (let dia=1; dia<=totalDias; dia++) {
        const dataStr = `${ano}-${String(mes+1).padStart(2,"0")}-${String(dia).padStart(2,"0")}`;
        const ds = new Date(ano, mes, dia), dw = ds.getDay();
        const chaveF = `${String(mes+1).padStart(2,"0")}-${String(dia).padStart(2,"0")}`, ehFeriado = FERIADOS[chaveF];
        const doDia = batalhas.filter(b => normalizarData(b.data) === dataStr);
        let classe = "", status = "";
        if (ehFeriado || dw === 0) { classe = "domingo-feriado"; status = "DOM"; }
        else if (doDia.some(b => getSituacao(b) === "CAMPANHA")) { classe = "campanha"; status = "⚠️"; }
        else if (doDia.some(b => getSituacao(b) === "FALTA OPONENTE")) { classe = "falta-oponente"; status = "⏳"; }
        else if (doDia.some(b => getSituacao(b) === "CONFIRMADA")) { classe = "confirmada"; status = "✓"; }
        const ehHoje = dataStr === hojeStr, destaque = ehHoje ? "hoje" : "";
        html += `<div class="dia ${classe} ${destaque}">${dia}${status?`<div class="status-mini">${status}</div>`:""}</div>`;
    }
    document.getElementById("gradeDias").innerHTML = html;
}

function renderizarAgencia() {
    const camp = batalhas.filter(b => getSituacao(b) === "CAMPANHA").sort(ordenarPorData);
    const conf = batalhas.filter(b => getSituacao(b) === "CONFIRMADA").sort(ordenarPorData);
    const falt = batalhas.filter(b => getSituacao(b) === "FALTA OPONENTE").sort(ordenarPorData);
    document.getElementById("todasCampanhas").innerHTML = camp.length ? camp.map(montarCard).join("") : `<div class="lista-vazia">📭 Vazio</div>`;
    document.getElementById("todasConfirmadas").innerHTML = conf.length ? conf.map(montarCard).join("") : `<div class="lista-vazia">📭 Vazio</div>`;
    document.getElementById("todasFaltaOponente").innerHTML = falt.length ? falt.map(montarCard).join("") : `<div class="lista-vazia">📭 Vazio</div>`;
}
</script>
</body>
</html>
