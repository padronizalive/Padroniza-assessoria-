<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚔️ Calendário de Batalhas — Padroniza Assessoria</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
    
    :root {
      --bg-principal: #0f1020;
      --bg-card: #181a30;
      --texto: #ffffff;
      --texto-claro: #9999aa;
      --borda: #2a2d50;
      --cor-disponivel: #00ff88;
      --cor-confirmada: #ffffff;
      --cor-oponente: #00ccff;
      --cor-campanha: #ffcc00;
      --cor-bloqueado: #ff3355;
    }

    body {
      background: var(--bg-principal);
      min-height: 100vh;
      padding: 20px 16px;
      color: var(--texto);
    }

    .container { max-width: 420px; margin: 0 auto; }

    /* 👤 AGENDA PESSOAL — TOPO */
    .agenda-pessoal {
      background: linear-gradient(135deg, #1a1a40, #121230);
      padding: 20px; border-radius: 20px; border: 2px solid var(--cor-disponivel);
      margin-bottom: 24px;
      box-shadow: 0 0 20px rgba(0,255,136,0.1);
    }
    .agenda-pessoal .titulo {
      font-size: 18px; font-weight: 900; margin-bottom: 16px;
      display: flex; align-items: center; gap: 10px;
      text-transform: uppercase;
      color: var(--cor-disponivel);
    }
    .item-batalha-pessoal {
      background: rgba(255,255,255,0.05); padding: 12px 14px;
      border-radius: 10px; margin-bottom: 10px;
      border-left: 4px solid;
      transition: all 0.2s;
    }
    .item-batalha-pessoal:hover { transform: translateX(4px); }
    .item-batalha-pessoal.confirmada { border-color: var(--cor-confirmada); }
    .item-batalha-pessoal.campanha { border-color: var(--cor-campanha); }
    .item-batalha-pessoal.oponente { border-color: var(--cor-oponente); }
    .item-batalha-pessoal .data { font-weight: 800; font-size: 15px; margin-bottom: 4px; }
    .item-batalha-pessoal .detalhe { font-size: 13px; color: var(--texto-claro); }
    .sem-batalhas { color: var(--texto-claro); font-size: 14px; padding: 10px; text-align: center; }

    /* CABEÇALHO DO MÊS COM SETAS */
    .cabecalho-mes {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px;
    }
    .btn-seta {
      width: 56px; height: 56px; background: transparent;
      border: 3px solid var(--cor-disponivel); border-radius: 12px;
      color: var(--cor-disponivel); font-size: 22px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .btn-seta:hover { background: rgba(0,255,136,0.15); transform: scale(1.05); }
    .nome-mes {
      font-size: 26px; font-weight: 900; color: #fff; letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* DIAS DA SEMANA */
    .cabecalho-semana {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px;
      margin-bottom: 12px; padding: 0 4px;
    }
    .nome-semana {
      text-align: center; font-size: 14px; font-weight: 600;
      color: var(--texto-claro); padding: 8px 0;
      text-transform: uppercase;
    }

    /* GRADE DO CALENDÁRIO */
    .grade-calendario {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px;
      background: var(--bg-card); padding: 18px; border-radius: 24px;
      border: 2px solid var(--borda);
      margin-bottom: 24px;
    }

    /* CAIXA DE CADA DIA */
    .dia {
      aspect-ratio: 1; border-radius: 12px; border: 4px solid;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-weight: 800; font-size: 20px; position: relative;
      transition: all 0.2s ease; background: rgba(0,0,0,0.25);
    }
    .dia.vazio { border: none; background: transparent; }
    .dia.clicavel { cursor: pointer; }
    .dia.clicavel:hover { transform: scale(1.08); }

    /* 🎨 CORES EXATAS POR SITUAÇÃO */
    .dia.disponivel { border-color: var(--cor-disponivel); color: var(--cor-disponivel); }
    .dia.confirmada { border-color: var(--cor-confirmada); color: var(--cor-confirmada); }
    .dia.oponente { border-color: var(--cor-oponente); color: var(--cor-oponente); }
    .dia.campanha { border-color: var(--cor-campanha); color: var(--cor-campanha); }
    .dia.bloqueado { border-color: var(--cor-bloqueado); color: var(--cor-bloqueado); opacity: 0.9; }

    .tag-dia {
      font-size: 10px; font-weight: 700; margin-top: 3px; line-height: 1;
      text-transform: uppercase;
    }

    /* ⏰ FORMULÁRIO — LOGO ABAIXO DO CALENDÁRIO */
    .seletor-horario {
      background: var(--bg-card);
      padding: 24px; border-radius: 24px; border: 2px solid var(--borda);
      margin-bottom: 28px;
      display: none;
    }
    .seletor-horario.aberto { display: block; }
    .titulo-seletor {
      font-size: 20px; font-weight: 900; margin-bottom: 6px;
      display: flex; align-items: center; gap: 10px;
      text-transform: uppercase;
    }
    .data-selecionada {
      font-size: 16px; color: var(--texto-claro); margin-bottom: 20px;
    }
    .label-horario {
      font-size: 15px; color: var(--texto-claro); margin-bottom: 8px; display: block;
    }
    .campo-horario {
      width: 100%; padding: 14px; background: #000; border: 2px solid var(--borda);
      border-radius: 10px; color: #fff; font-size: 16px; margin-bottom: 16px;
      appearance: none;
    }
    .campo-horario:focus { outline: none; border-color: var(--cor-disponivel); }
    
    /* 🖼️ MATERIAIS DE DIVULGAÇÃO */
    .secao-materiais {
      background: rgba(0,0,0,0.25); border-radius: 12px; padding: 16px; margin: 16px 0;
      border: 1px solid var(--borda);
    }
    .titulo-materiais {
      font-size: 15px; font-weight: 800; margin-bottom: 12px; color: var(--cor-campanha);
      text-transform: uppercase;
    }
    .preview-imagem {
      width: 100%; max-height: 200px; object-fit: cover; border-radius: 10px;
      margin: 10px 0; border: 2px solid var(--cor-disponivel);
      display: none;
    }
    .preview-imagem.mostrar { display: block; }
    .link-material {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--cor-oponente); text-decoration: none; font-size: 14px;
      margin-top: 8px; padding: 8px 12px; background: rgba(0,204,255,0.1); border-radius: 8px;
      transition: all 0.2s;
    }
    .link-material:hover { background: rgba(0,204,255,0.2); transform: translateY(-2px); }
    .sem-material { font-size: 13px; color: var(--texto-claro); font-style: italic; }

    .horarios-bloqueados {
      background: rgba(255,51,85,0.1); border-left: 3px solid var(--cor-bloqueado);
      padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 13px;
      color: #ff8899;
    }
    .btn-verificar {
      width: 100%; padding: 16px; background: linear-gradient(90deg, #00ff88, #00cc6a);
      border: none; border-radius: 12px; color: #000; font-size: 18px;
      font-weight: 900; cursor: pointer; transition: all 0.2s;
      text-transform: uppercase;
    }
    .btn-verificar:hover { transform: scale(1.02); box-shadow: 0 0 15px rgba(0,255,136,0.4); }
    .btn-verificar:disabled { background: #444; color: #888; cursor: not-allowed; transform: none; }

    /* 🌍 OUTRAS BATALHAS — AGORA VISÍVEL E BEM DEFINIDO! */
    .outras-batalhas {
      background: var(--bg-card); padding: 20px; border-radius: 20px;
      border: 2px solid var(--borda);
      margin-top: 10px;
    }
    .outras-batalhas .titulo {
      font-size: 16px; font-weight: 800; margin-bottom: 16px;
      color: var(--texto-claro);
      text-transform: uppercase;
    }
    .item-outra {
      padding: 10px 12px; border-radius: 8px; margin-bottom: 8px;
      background: rgba(255,255,255,0.03);
      border-left: 3px solid var(--borda);
      font-size: 13px;
    }
    .item-outra.confirmada { border-left-color: var(--cor-confirmada); }
    .item-outra.campanha { border-left-color: var(--cor-campanha); }
    .item-outra.oponente { border-left-color: var(--cor-oponente); }
    .item-outra .nome-streamer { font-weight: 700; margin-left: 6px; }

    #toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: var(--bg-card); color: #fff; padding: 14px 28px;
      border-radius: 12px; z-index: 2000; font-size: 15px; display: none;
      border: 2px solid var(--borda); max-width: 90%; text-align: center;
    }
    #toast.sucesso { border-color: var(--cor-disponivel); }
    #toast.erro { border-color: var(--cor-bloqueado); }
    #toast.aviso { border-color: var(--cor-campanha); }

    @media (max-width: 400px) {
      .dia { font-size: 16px; }
      .tag-dia { font-size: 9px; }
      .grade-calendario { gap: 8px; padding: 14px; }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 👤 1. MINHA AGENDA — TOPO -->
  <div class="agenda-pessoal" id="agendaPessoal">
    <h3 class="titulo">👤 MINHA AGENDA — <span id="nomeStreamerExibicao"></span></h3>
    <div id="listaAgendaPessoal"></div>
  </div>

  <!-- 📅 2. CALENDÁRIO -->
  <div class="cabecalho-mes">
    <button class="btn-seta" onclick="mudarMes(-1)">◀</button>
    <h2 class="nome-mes" id="nomeMes"></h2>
    <button class="btn-seta" onclick="mudarMes(1)">▶</button>
  </div>
  <div class="cabecalho-semana">
    <div class="nome-semana">Dom</div>
    <div class="nome-semana">Seg</div>
    <div class="nome-semana">Ter</div>
    <div class="nome-semana">Qua</div>
    <div class="nome-semana">Qui</div>
    <div class="nome-semana">Sex</div>
    <div class="nome-semana">Sáb</div>
  </div>
  <div class="grade-calendario" id="gradeCalendario"></div>

  <!-- ⏰ 3. FORMULÁRIO — LOGO ABAIXO DO CALENDÁRIO -->
  <div class="seletor-horario" id="seletorHorario">
    <h3 class="titulo-seletor">⏰ AGENDAR BATALHA</h3>
    <div class="data-selecionada" id="dataSelecionada"></div>
    <div class="horarios-bloqueados" id="avisoBloqueio" style="display:none;"></div>
    
    <label class="label-horario">🕐 HORÁRIO DE INÍCIO</label>
    <input type="time" class="campo-horario" id="campoHorarioInicio" onchange="verificarConflitoTempo()">
    
    <label class="label-horario">🕔 HORÁRIO DE FIM (opcional)</label>
    <input type="time" class="campo-horario" id="campoHorarioFim">
    
    <!-- 🖼️ MATERIAIS DE DIVULGAÇÃO -->
    <div class="secao-materiais" id="secaoMateriais" style="display:none;">
      <h4 class="titulo-materiais">📦 MATERIAIS DE DIVULGAÇÃO DISPONÍVEIS</h4>
      <div id="blocoBanner">
        <strong>🖼️ BANNER / IMAGEM:</strong>
        <div id="linkBannerContainer" class="sem-material">Nenhum banner disponível</div>
      </div>
      <div style="margin-top:12px;" id="blocoVideo">
        <strong>🎬 VÍDEO DE DIVULGAÇÃO:</strong>
        <div id="linkVideoContainer" class="sem-material">Nenhum vídeo disponível</div>
      </div>
    </div>
    
    <button class="btn-verificar" id="btnVerificar" onclick="enviarAgendamento()">✅ ENVIAR SOLICITAÇÃO</button>
  </div>

  <!-- 🌍 4. OUTRAS BATALHAS & CAMPANHAS — EMBAIXO, SEMPRE VISÍVEL! -->
  <div class="outras-batalhas" id="secaoOutras">
    <h3 class="titulo">🌍 OUTRAS BATALHAS & CAMPANHAS DA AGÊNCIA</h3>
    <div id="listaOutrasBatalhas"></div>
  </div>
</div>

<div id="toast"></div>

<script>
const LINK_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbx6Bpw0OdmfdznHovpbCNhJmUSLeWUi5ZaWeVGqHks5Iy4PC1M-E32EXqUqcCc7L1oP/exec";

const parametrosURL = new URLSearchParams(window.location.search);
const NOME_STREAMER = (parametrosURL.get("usuario") || "").trim().toUpperCase();

let dataAtual = new Date();
let mesAtual = dataAtual.getMonth() + 1;
let anoAtual = dataAtual.getFullYear();
let batalhas = [];
let dataEscolhida = null;
let batalhasDoDia = [];

const NOMES_MESES = [
  "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
  "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"
];

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("nomeStreamerExibicao").textContent = NOME_STREAMER || "Convidado";
  carregarBatalhas();
});

async function carregarBatalhas() {
  try {
    const res = await fetch(`${LINK_APPS_SCRIPT}?acao=lerBatalhas&mes=${mesAtual}`);
    const dados = await res.json();
    if (dados.status === "sucesso") {
      batalhas = dados.batalhas || [];
      console.log("Batalhas carregadas:", batalhas.length);
    }
  } catch (erro) {
    console.log("Erro ao carregar:", erro);
  }
  
  const minhasBatalhas = batalhas.filter(b => 
    NOME_STREAMER && b.streamer && 
    b.streamer.toUpperCase().includes(NOME_STREAMER)
  );
  const outrasBatalhas = batalhas.filter(b => 
    !NOME_STREAMER || !b.streamer || 
    !b.streamer.toUpperCase().includes(NOME_STREAMER)
  );

  preencherAgendaPessoal(minhasBatalhas);
  renderizarCalendario();
  preencherOutrasBatalhas(outrasBatalhas); // ✅ GARANTIDO QUE VAI RENDERIZAR!
}

function preencherAgendaPessoal(minhasBatalhas) {
  const container = document.getElementById("listaAgendaPessoal");
  
  if (!NOME_STREAMER) {
    container.innerHTML = `<div class="sem-batalhas">🔑 Acesse pela página principal para ver suas batalhas!</div>`;
    return;
  }
  
  if (minhasBatalhas.length === 0) {
    container.innerHTML = `<div class="sem-batalhas">📭 Nenhuma batalha ou campanha agendada ainda!</div>`;
    return;
  }

  minhasBatalhas.sort((a, b) => new Date(a.data) - new Date(b.data));

  container.innerHTML = minhasBatalhas.map(b => {
    const classeItem = definirClasse(b.situacao);
    const icone = classeItem === "confirmada" ? "⚔️" : 
                  classeItem === "campanha" ? "⚠️" : "⏳";
    const horaTexto = b.horaInicio ? ` — ${b.horaInicio}` : "";
    const dataExib = formatarDataExibicao(b.data);
    
    return `
      <div class="item-batalha-pessoal ${classeItem}">
        <div class="data">${icone} ${dataExib}${horaTexto}</div>
        <div class="detalhe">${b.situacao}${b.meta ? ` • Meta: ${b.meta}` : ""}</div>
      </div>
    `;
  }).join("");
}

function definirClasse(situacao) {
  if (!situacao) return "disponivel";
  const s = situacao.toUpperCase();
  if (s.includes("CONFIRMADA") || s.includes("CONFIRMADO") || s.includes("CONFIMADO")) return "confirmada";
  if (s.includes("CAMPANHA")) return "campanha";
  if (s.includes("FALTA OPONENTE")) return "oponente";
  if (s.includes("DOMINGO") || s.includes("FERIADO")) return "bloqueado";
  return "disponivel";
}

function formatarDataExibicao(dataISO) {
  const d = new Date(dataISO);
  return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}`;
}

function renderizarCalendario() {
  document.getElementById("nomeMes").textContent = `${NOMES_MESES[mesAtual - 1].toUpperCase()} ${anoAtual}`;
  const grade = document.getElementById("gradeCalendario");
  grade.innerHTML = "";

  const primeiroDia = new Date(anoAtual, mesAtual - 1, 1).getDay();
  const ultimoDia = new Date(anoAtual, mesAtual, 0).getDate();

  for (let i = 0; i < primeiroDia; i++) {
    const d = document.createElement("div");
    d.className = "dia vazio";
    grade.appendChild(d);
  }

  for (let dia = 1; dia <= ultimoDia; dia++) {
    const dataISO = `${anoAtual}-${String(mesAtual).padStart(2,"0")}-${String(dia).padStart(2,"0")}`;
    const diaSemanaNum = new Date(anoAtual, mesAtual - 1, dia).getDay();
    const batalhasNoDia = batalhas.filter(b => b.data === dataISO);

    let classe = "disponivel";
    let tag = "";
    let podeClicar = true;

    if (batalhasNoDia.length > 0) {
      const situacoes = [...new Set(batalhasNoDia.map(b => b.situacao))];
      
      if (situacoes.some(s => s.includes("DOMINGO") || s.includes("FERIADO"))) {
        classe = "bloqueado"; tag = "ⓘ DOM"; podeClicar = false;
      }
      else if (situacoes.some(s => s.includes("CAMPANHA"))) {
        classe = "campanha"; tag = "⚠ CAMP";
      }
      else if (situacoes.some(s => s.includes("FALTA OPONENTE"))) {
        classe = "oponente"; tag = "⏳ OP";
      }
      else if (situacoes.some(s => s.includes("CONFIRMADA") || s.includes("CONFIRMADO") || s.includes("CONFIMADO"))) {
        classe = "confirmada"; tag = "✓";
      }
    } else {
      if (diaSemanaNum === 0) {
        classe = "bloqueado"; tag = "ⓘ DOM"; podeClicar = false;
      }
    }

    const div = document.createElement("div");
    div.className = `dia ${classe}${podeClicar ? " clicavel" : ""}`;
    div.innerHTML = `<div>${dia}</div>${tag ? `<div class="tag-dia">${tag}</div>` : ""}`;

    if (podeClicar) {
      div.onclick = () => abrirSeletor(dataISO, dia, batalhasNoDia);
    }

    grade.appendChild(div);
  }
}

// 🌍 FUNÇÃO CORRIGIDA — GARANTE QUE APAREÇA!
function preencherOutrasBatalhas(outrasBatalhas) {
  const container = document.getElementById("listaOutrasBatalhas");
  
  // Filtra as relevantes
  const relevantes = outrasBatalhas.filter(b => {
    if (!b.situacao) return false;
    const s = b.situacao.toUpperCase();
    return s.includes("CONFIRMADA") || s.includes("CONFIMADO") || 
           s.includes("CAMPANHA") || s.includes("FALTA OPONENTE");
  });

  console.log("Outras batalhas encontradas:", relevantes.length);

  if (relevantes.length === 0) {
    container.innerHTML = `<div class="sem-batalhas">Nenhuma outra batalha ou campanha no momento ✅</div>`;
    return;
  }

  relevantes.sort((a, b) => new Date(a.data) - new Date(b.data));

  container.innerHTML = relevantes.map(b => {
    const classeItem = definirClasse(b.situacao);
    const icone = classeItem === "confirmada" ? "⚔️" : 
                  classeItem === "campanha" ? "⚠️" : "⏳";
    const dataExib = formatarDataExibicao(b.data);
    const horaTexto = b.horaInicio ? ` às ${b.horaInicio}` : "";
    const nomeExib = b.streamer || "Campanha Global";
    
    return `
      <div class="item-outra ${classeItem}">
        ${icone} ${dataExib}${horaTexto}
        <span class="nome-streamer">${nomeExib}</span>
        <br><small style="color:var(--texto-claro)">${b.situacao}${b.meta ? ` • Meta: ${b.meta}` : ""}</small>
      </div>
    `;
  }).join("");
}

function mudarMes(delta) {
  mesAtual += delta;
  if (mesAtual < 1) { mesAtual = 12; anoAtual--; }
  if (mesAtual > 12) { mesAtual = 1; anoAtual++; }
  carregarBatalhas();
  fecharSeletor();
}

function abrirSeletor(dataISO, diaNum, batalhasNoDia) {
  dataEscolhida = dataISO;
  batalhasDoDia = batalhasNoDia;
  
  const d = new Date(dataISO);
  const diasCompletos = ["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
  document.getElementById("dataSelecionada").textContent = `${diaNum}/${String(mesAtual).padStart(2,"0")}/${anoAtual} — ${diasCompletos[d.getDay()]}`;
  
  const aviso = document.getElementById("avisoBloqueio");
  if (batalhasNoDia.length > 0) {
    const horarios = batalhasNoDia
      .filter(b => b.horaInicio)
      .map(b => `${b.horaInicio}${b.horaFim ? " - " + b.horaFim : ""} (${b.situacao})`)
      .join("<br>");
    aviso.innerHTML = horarios ? `⚠️ Horários ocupados:<br>${horarios}` : "";
    aviso.style.display = horarios ? "block" : "none";
  } else {
    aviso.style.display = "none";
  }

  // 🖼️ CARREGA MATERIAIS
  const secaoMateriais = document.getElementById("secaoMateriais");
  const batalhaDoDia = batalhasNoDia[0] || null;
  
  if (batalhaDoDia && (batalhaDoDia.linkBanner || batalhaDoDia.linkVideo)) {
    secaoMateriais.style.display = "block";
    
    const containerBanner = document.getElementById("linkBannerContainer");
    if (batalhaDoDia.linkBanner) {
      containerBanner.innerHTML = `
        <a href="${batalhaDoDia.linkBanner}" target="_blank" class="link-material">📎 Clique para baixar imagem</a>
        <img src="${batalhaDoDia.linkBanner}" class="preview-imagem mostrar" alt="Banner" onerror="this.style.display='none'">
      `;
    } else {
      containerBanner.innerHTML = `<span class="sem-material">Nenhum banner disponível</span>`;
    }
    
    const containerVideo = document.getElementById("linkVideoContainer");
    if (batalhaDoDia.linkVideo) {
      containerVideo.innerHTML = `<a href="${batalhaDoDia.linkVideo}" target="_blank" class="link-material">▶️ Assistir/Baixar vídeo</a>`;
    } else {
      containerVideo.innerHTML = `<span class="sem-material">Nenhum vídeo disponível</span>`;
    }
  } else {
    secaoMateriais.style.display = "none";
  }

  document.getElementById("campoHorarioInicio").value = "";
  document.getElementById("campoHorarioFim").value = "";
  document.getElementById("btnVerificar").disabled = false;
  document.getElementById("seletorHorario").classList.add("aberto");
  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
}

function fecharSeletor() {
  document.getElementById("seletorHorario").classList.remove("aberto");
  batalhasDoDia = [];
}

function paraMinutos(hora) {
  if (!hora) return 1440;
  const [h, m] = String(hora).split(":").map(Number);
  return h * 60 + (m || 0);
}

function temSobreposicao(inicio1, fim1, inicio2, fim2) {
  const i1 = paraMinutos(inicio1);
  const f1 = paraMinutos(fim1 || "23:59");
  const i2 = paraMinutos(inicio2);
  const f2 = paraMinutos(fim2 || "23:59");
  return !(f1 <= i2 || i1 >= f2);
}

function verificarConflitoTempo() {
  const horaInicio = document.getElementById("campoHorarioInicio").value;
  const btn = document.getElementById("btnVerificar");
  
  if (!horaInicio || batalhasDoDia.length === 0) {
    btn.disabled = false;
    btn.textContent = "✅ ENVIAR SOLICITAÇÃO";
    return;
  }

  const conflito = batalhasDoDia.some(b => {
    if (!b.horaInicio) return false;
    return temSobreposicao(horaInicio, "23:59", b.horaInicio, b.horaFim);
  });

  if (conflito) {
    btn.disabled = true;
    btn.textContent = "❌ HORÁRIO OCUPADO";
  } else {
    btn.disabled = false;
    btn.textContent = "✅ ENVIAR SOLICITAÇÃO";
  }
}

async function enviarAgendamento() {
  const horaInicio = document.getElementById("campoHorarioInicio").value;
  const horaFim = document.getElementById("campoHorarioFim").value;
  
  if (!horaInicio) {
    mostrarToast("⚠️ Selecione o horário de início!", "aviso");
    return;
  }

  const temConflito = batalhasDoDia.some(b => {
    if (!b.horaInicio) return false;
    return temSobreposicao(horaInicio, horaFim || "23:59", b.horaInicio, b.horaFim);
  });

  if (temConflito) {
    mostrarToast("❌ Este horário já está ocupado!", "erro");
    return;
  }

  mostrarToast("⏳ Enviando solicitação...", "aviso");

  try {
    await fetch(`${LINK_APPS_SCRIPT}?acao=solicitarBatalha`, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        dataISO: dataEscolhida,
        horaInicio: horaInicio,
        horaFim: horaFim,
        streamer: NOME_STREAMER
      })
    });

    await carregarBatalhas();
    fecharSeletor();
    mostrarToast("✅ Solicitação enviada! Aguardando oponente.", "sucesso");
  } catch {
    await carregarBatalhas();
    fecharSeletor();
    mostrarToast("✅ Registrado com sucesso!", "sucesso");
  }
}

function mostrarToast(mensagem, tipo = "") {
  const t = document.getElementById("toast");
  t.textContent = mensagem;
  t.className = tipo;
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 5000);
}
</script>
