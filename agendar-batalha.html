<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Agenda — Padroniza Assessoria</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        :root {
            --verde: #00ff9c; --verde-escuro: #00cc7d;
            --amarelo: #ffd700; --azul: #00a8ff; --branco: #f0f0f0;
            --vermelho: #ff4444; --roxo: #8a2be2; --fundo: #0f0f1a; --card: #1a1a2e; --texto: #ffffff;
        }
        body { background: var(--fundo); color: var(--texto); min-height: 100vh; padding: 16px; }
        .container { max-width: 95%; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 20px; }
        .logo { font-size: 26px; font-weight: bold; background: linear-gradient(90deg, var(--verde), var(--azul)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .logo::before { content: "⚔️"; font-size: 28px; }
        .subtitulo { color: #aaa; font-size: 14px; }

        /* ===== INFO USUÁRIO ===== */
        .info-usuario { background: var(--card); padding: 16px 20px; border-radius: 14px; margin-bottom: 24px; display: flex; flex-direction: column; gap: 8px; }
        .info-linha { display: flex; align-items: center; gap: 8px; font-size: 17px; }
        .info-icone { font-size: 20px; }
        .info-valor { font-weight: 600; color: var(--verde); }

        /* ===== MINHA AGENDA — DESIGN BONITO ===== */
        .agenda-section { background: var(--card); padding: 20px; border-radius: 14px; margin-bottom: 24px; border: 1px solid rgba(0,255,156,0.2); }
        .agenda-titulo { font-size: 20px; font-weight: bold; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .agenda-titulo::before { content: "📋"; font-size: 22px; }
        .agenda-vazia { color: #888; font-size: 15px; padding: 30px; text-align: center; }
        .agenda-lista { display: flex; flex-direction: column; gap: 14px; }
        .agenda-card { padding: 16px; border-radius: 12px; border-left: 4px solid; transition: 0.2s; background: rgba(255,255,255,0.03); }
        .agenda-card:hover { transform: translateY(-2px); background: rgba(255,255,255,0.05); }

        /* Cores por status */
        .card-campanha { border-color: var(--amarelo); }
        .card-campanha .etiqueta { background: rgba(255,215,0,0.15); color: var(--amarelo); }
        .card-falta-oponente { border-color: var(--azul); }
        .card-falta-oponente .etiqueta { background: rgba(0,168,255,0.15); color: var(--azul); }
        .card-confirmada { border-color: var(--verde); }
        .card-confirmada .etiqueta { background: rgba(0,255,156,0.15); color: var(--verde); }

        .card-cabecalho { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .card-data { display: flex; align-items: center; gap: 6px; font-size: 15px; color: #ccc; }
        .card-data::before { content: "📅"; }
        .etiqueta { font-size: 12px; padding: 4px 12px; border-radius: 20px; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .etiqueta-campanha::before { content: "📢"; }
        .etiqueta-oponente::before { content: "⏳"; }
        .etiqueta-confirmada::before { content: "✅"; }

        .card-corpo { font-size: 18px; font-weight: bold; margin: 10px 0; line-height: 1.5; }
        .card-batalha-nome { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .nome-streamer { color: var(--verde); }
        .nome-oponente { color: var(--azul); }
        .icone-batalha { color: #888; font-size: 20px; }
        .sem-oponente { color: #888; }

        .card-detalhes { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 10px; font-size: 14px; }
        .detalhe-item { display: flex; align-items: center; gap: 5px; color: #aaa; }
        .detalhe-item a { color: var(--azul); text-decoration: none; }
        .detalhe-item a:hover { text-decoration: underline; }

        /* ===== CALENDÁRIO E OUTROS ===== */
        .legenda { background: var(--card); padding: 16px; border-radius: 12px; margin-bottom: 20px; }
        .legenda h3 { margin-bottom: 12px; font-size: 15px; }
        .legenda-itens { display: flex; flex-wrap: wrap; gap: 12px; }
        .item-legenda { display: flex; align-items: center; gap: 6px; font-size: 13px; }
        .cor { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.2); }

        .calendario { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .navegacao-mes { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .btn-nav { background: transparent; border: 1px solid var(--verde); color: var(--verde); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 600; }
        .nome-mes { font-size: 20px; font-weight: bold; }
        .dias-semana { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 8px; }
        .dia-semana { text-align: center; font-size: 13px; color: #888; padding: 8px; font-weight: 600; }
        .grade-dias { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .dia { aspect-ratio: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 10px; cursor: pointer; transition: 0.2s; font-size: 15px; border: 1px solid transparent; font-weight: 600; }
        .dia.vazio { cursor: default; background: transparent; }
        .dia.disponivel { background: rgba(0,255,156,0.1); border-color: rgba(0,255,156,0.3); color: var(--verde); }
        .dia.campanha { background: rgba(255,215,0,0.1); border-color: rgba(255,215,0,0.3); color: var(--amarelo); }
        .dia.falta-oponente { background: rgba(0,168,255,0.1); border-color: rgba(0,168,255,0.3); color: var(--azul); }
        .dia.confirmada { background: rgba(80,80,80,0.2); border-color: rgba(150,150,150,0.3); color: #999; cursor: not-allowed; }
        .dia.bloqueado { background: rgba(255,68,68,0.08); border-color: rgba(255,68,68,0.2); color: var(--vermelho); cursor: not-allowed; }
        .dia.domingo { background: rgba(255,68,68,0.08); border-color: rgba(255,68,68,0.2); color: var(--vermelho); cursor: not-allowed; }
        .dia.feriado { background: rgba(138,43,226,0.08); border-color: rgba(138,43,226,0.2); color: #c8a2ff; cursor: not-allowed; }
        .status-mini { font-size: 9px; margin-top: 2px; font-weight: normal; }

        .secao-horario { background: var(--card); padding: 22px; border-radius: 12px; margin-bottom: 20px; display: none; }
        .secao-horario.visivel { display: block; }
        .secao-horario h3 { margin-bottom: 16px; font-size: 17px; display: flex; align-items: center; gap: 8px; }
        .secao-horario h3::before { content: "⏰"; }
        .grupo-horario { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
        .input-horario { flex: 1; min-width: 140px; padding: 14px; border-radius: 8px; border: 2px solid #333; background: #0f0f1a; color: white; font-size: 20px; font-weight: bold; text-align: center; }
        .btn-verificar { padding: 14px 24px; background: linear-gradient(90deg, var(--verde), var(--verde-escuro)); color: #000; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .status-horario { margin-top: 16px; padding: 14px; border-radius: 8px; display: none; font-weight: 600; }
        .status-horario.visivel { display: block; }
        .status-horario.livre { background: rgba(0,255,156,0.1); border: 1px solid var(--verde); color: var(--verde); }
        .status-horario.bloqueado { background: rgba(255,68,68,0.1); border: 1px solid var(--vermelho); color: var(--vermelho); }

        .formulario { background: var(--card); padding: 22px; border-radius: 12px; margin-bottom: 20px; display: none; }
        .formulario.visivel { display: block; }
        .formulario h3 { margin-bottom: 18px; font-size: 17px; }
        .grupo-form { margin-bottom: 14px; }
        .grupo-form label { display: block; margin-bottom: 6px; font-size: 14px; color: #ccc; }
        .grupo-form input, .grupo-form select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #0f0f1a; color: white; font-size: 15px; }
        .checkbox-group { display: flex; gap: 20px; flex-wrap: wrap; padding: 8px 0; }
        .checkbox-label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 15px; }
        .btn-enviar { width: 100%; padding: 16px; background: linear-gradient(90deg, var(--verde), var(--verde-escuro)); color: #000; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .botoes-acao { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
        .btn-voltar { flex: 1; min-width: 130px; padding: 14px; background: transparent; border: 1px solid #555; color: #aaa; border-radius: 8px; font-size: 15px; cursor: pointer; }

        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--verde); color: #000; padding: 12px 24px; border-radius: 8px; font-weight: bold; z-index: 9999; display: none; font-size: 15px; box-shadow: 0 4px 20px rgba(0,255,156,0.3); }
        @media(max-width:600px) { .dia { font-size: 13px; } .card-corpo { font-size: 16px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="logo">Padroniza Assessoria</h1>
            <p class="subtitulo">Agendamento de Batalhas — Kako Live & TikTok</p>
        </div>

        <div class="info-usuario">
            <div class="info-linha">
                <span class="info-icone">👤</span>
                <span>Streamer:</span>
                <span class="info-valor" id="nomeUsuario">Carregando...</span>
            </div>
            <div class="info-linha">
                <span class="info-icone">📅</span>
                <span>Hoje:</span>
                <span class="info-valor" id="dataHoje"></span>
            </div>
        </div>

        <!-- 📋 MINHA AGENDA — DESIGN BONITO! -->
        <div class="agenda-section">
            <h2 class="agenda-titulo">Minha Agenda — <span id="mesAgenda"></span></h2>
            <div id="listaAgenda" class="agenda-lista">
                <div class="agenda-vazia">Carregando suas batalhas...</div>
            </div>
        </div>

        <div class="legenda">
            <h3>📋 Legenda</h3>
            <div class="legenda-itens">
                <div class="item-legenda"><div class="cor" style="background:rgba(255,215,0,0.3);"></div> Campanha</div>
                <div class="item-legenda"><div class="cor" style="background:rgba(0,168,255,0.3);"></div> Falta Oponente</div>
                <div class="item-legenda"><div class="cor" style="background:rgba(0,255,156,0.3);"></div> Confirmada</div>
                <div class="item-legenda"><div class="cor" style="background:rgba(255,68,68,0.3);"></div> Domingo/Feriado</div>
            </div>
        </div>

        <div class="calendario">
            <div class="navegacao-mes">
                <button class="btn-nav" id="btnMesAnterior">◀</button>
                <h2 class="nome-mes" id="nomeMes"></h2>
                <button class="btn-nav" id="btnProximoMes">▶</button>
            </div>
            <div class="dias-semana">
                <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
            </div>
            <div class="grade-dias" id="gradeDias"></div>
        </div>

        <div class="secao-horario" id="secaoHorario">
            <h3>Selecione o Horário — <span id="dataSelecionada"></span></h3>
            <div class="grupo-horario">
                <input type="time" id="inputHorario" class="input-horario" step="60">
                <button class="btn-verificar" id="btnVerificarHorario">✅ Verificar Disponibilidade</button>
            </div>
            <div class="status-horario" id="statusHorario">
                <strong id="textoStatusHorario"></strong>
            </div>
        </div>

        <div class="formulario" id="secaoFormulario">
            <h3>📝 Solicitar Batalha Oficial</h3>
            <div class="grupo-form">
                <label>Streamer</label>
                <input type="text" id="formStreamer" readonly>
            </div>
            <div class="grupo-form">
                <label>Data</label>
                <input type="text" id="formData" readonly>
            </div>
            <div class="grupo-form">
                <label>Horário</label>
                <input type="text" id="formHorario" readonly>
            </div>
            <div class="grupo-form">
                <label>Link do Perfil (TikTok/Kako)</label>
                <input type="url" id="formLink" placeholder="Cole o link do seu perfil aqui">
            </div>
            <div class="grupo-form">
                <label>Meta de Diamantes</label>
                <input type="text" id="formMeta" placeholder="Ex: 5.000">
            </div>
            <div class="grupo-form">
                <label>🎨 Tipo de Arte</label>
                <div class="checkbox-group">
                    <label class="checkbox-label"><input type="checkbox" id="arteFoto"> 📸 Foto</label>
                    <label class="checkbox-label"><input type="checkbox" id="arteVideo"> 🎬 Vídeo</label>
                </div>
            </div>
            <button class="btn-enviar" id="btnEnviarSolicitacao">📤 ENVIAR SOLICITAÇÃO</button>
            <div class="botoes-acao">
                <button class="btn-voltar" id="btnVoltarCalendario">◀ Voltar</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

<script>
// ====================== CONFIGURAÇÃO ======================
const LINK_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbx6Bpw0OdmfdznHovpbCNhJmUSLeWUi5ZaWeVGqHks5Iy4PC1M-E32EXqUqcCc7L1oP/exec";
const WHATSAPP_AGENCIA = "5569981478873";

const FERIADOS = {
    "01-01": "Confraternização Universal", "03-04": "Carnaval", "04-10": "Paixão de Cristo",
    "04-21": "Tiradentes", "05-01": "Dia do Trabalho", "06-19": "Corpus Christi",
    "09-07": "Independência", "10-12": "Nossa Senhora Aparecida", "11-02": "Finados",
    "11-15": "Proclamação da República", "12-25": "Natal"
};

const COL = {
    NUMERO_DIA: 1, DATA: 2, HORA_INICIO: 3, HORA_FIM: 4, ROUND: 5,
    STREAMER: 6, OPONENTE: 8, LINK: 7, META: 10, SITUACAO: 11, BANNER: 16, VIDEO: 17
};

let dataAtual = new Date();
let dataSelecionada = null;
let horarioEscolhido = null;
let batalhas = [];
let nomeUsuario = "VISITANTE";

// ====================== INICIALIZAÇÃO ======================
document.addEventListener("DOMContentLoaded", async () => {
    const params = new URLSearchParams(window.location.search);
    nomeUsuario = (params.get("streamer") || params.get("usuario") || "VISITANTE").toUpperCase();
    document.getElementById("nomeUsuario").textContent = nomeUsuario;

    const hoje = new Date();
    document.getElementById("dataHoje").textContent = formatarData(hoje);
    atualizarMesAgenda();

    await carregarBatalhas();
    renderizarAgendaDoStreamer();
    renderizarCalendario();

    document.getElementById("btnMesAnterior").addEventListener("click", () => { dataAtual.setMonth(dataAtual.getMonth() - 1); renderizarCalendario(); });
    document.getElementById("btnProximoMes").addEventListener("click", () => { dataAtual.setMonth(dataAtual.getMonth() + 1); renderizarCalendario(); });
    document.getElementById("btnVerificarHorario").addEventListener("click", verificarDisponibilidade);
    document.getElementById("btnVoltarCalendario").addEventListener("click", voltarAoCalendario);
    document.getElementById("btnEnviarSolicitacao").addEventListener("click", enviarSolicitacao);
});

function atualizarMesAgenda() {
    const nomesMeses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
    document.getElementById("mesAgenda").textContent = `${nomesMeses[dataAtual.getMonth()]} ${dataAtual.getFullYear()}`;
}

// ====================== 📋 AGENDA DO STREAMER — REGRA EXATA! ======================
function renderizarAgendaDoStreamer() {
    atualizarMesAgenda();

    const batalhasDoStreamer = batalhas.filter(b => {
        const situacao = b.situacao;
        const ehCampanha = situacao === "CAMPANHA";
        const ehFaltaOp = situacao === "FALTA OPONENTE";
        const ehConfirmada = ["CONFIRMADA", "CONFIMADO"].includes(situacao);

        if (!ehCampanha && !ehFaltaOp && !ehConfirmada) return false;

        // ✅ REGRA EXATA:
        // Campanha "TODOS DA AGÊNCIA" → aparece para TODOS
        if (ehCampanha && b.streamer.includes("TODOS DA AGÊNCIA")) return true;
        
        // Outras campanhas, Falta Oponente e Confirmada → aparecem SÓ para o dono
        return b.streamer === nomeUsuario;
    });

    // Ordenar por data + horário
    batalhasDoStreamer.sort((a, b) => {
        const dataA = extrairDataBatalha(a.data, dataAtual.getFullYear(), dataAtual.getMonth());
        const dataB = extrairDataBatalha(b.data, dataAtual.getFullYear(), dataAtual.getMonth());
        if (!dataA || !dataB) return 0;
        if (dataA.getTime() !== dataB.getTime()) return dataA - dataB;
        return converterParaMinutos(a.horaInicio) - converterParaMinutos(b.horaInicio);
    });

    const lista = document.getElementById("listaAgenda");
    if (!batalhasDoStreamer.length) {
        lista.innerHTML = `<div class="agenda-vazia">📭 Nenhuma batalha ou campanha para você neste mês.</div>`;
        return;
    }

    lista.innerHTML = batalhasDoStreamer.map(b => {
        const situacao = b.situacao;
        const ehCampanha = situacao === "CAMPANHA";
        const ehFaltaOp = situacao === "FALTA OPONENTE";
        const ehConfirmada = ["CONFIRMADA", "CONFIMADO"].includes(situacao);
        const ehCampanhaGeral = ehCampanha && b.streamer.includes("TODOS DA AGÊNCIA");

        // Definir classes e etiquetas
        let classeCard = "", etiquetaTexto = "", classeEtiqueta = "";
        if (ehCampanha) {
            classeCard = "card-campanha";
            etiquetaTexto = "CAMPANHA";
            classeEtiqueta = "etiqueta-campanha";
        } else if (ehFaltaOp) {
            classeCard = "card-falta-oponente";
            etiquetaTexto = "FALTA OPONENTE";
            classeEtiqueta = "etiqueta-oponente";
        } else if (ehConfirmada) {
            classeCard = "card-confirmada";
            etiquetaTexto = "CONFIRMADA";
            classeEtiqueta = "etiqueta-confirmada";
        }

        // Formatar data bonito
        let dataExibicao = b.data || "—";
        if (dataExibicao.includes("T")) {
            const d = new Date(dataExibicao);
            if (!isNaN(d.getTime())) {
                dataExibicao = `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")} — ${b.horaInicio || "—"}`;
            } else {
                dataExibicao = dataExibicao.replace("T", " — ").substring(0, 16);
            }
        } else {
            dataExibicao = `${b.data || "—"} — ${b.horaInicio || "—"}`;
        }

        const oponente = b.oponente && b.oponente.trim() ? b.oponente : "???";
        const link = b.link || "";
        const meta = b.meta || "";

        // Texto da batalha
        let batalhaTexto = "";
        if (ehCampanha) {
            if (ehCampanhaGeral) {
                batalhaTexto = `<div class="card-batalha-nome"><span class="nome-streamer">TODOS DA AGÊNCIA</span> <span class="icone-batalha">⚔️</span> <span class="sem-oponente">???</span></div>`;
            } else {
                batalhaTexto = `<div class="card-batalha-nome"><span class="nome-streamer">${b.streamer}</span> <span class="icone-batalha">⚔️</span> <span class="sem-oponente">???</span></div>`;
            }
        } else if (ehFaltaOp) {
            batalhaTexto = `<div class="card-batalha-nome"><span class="nome-streamer">${b.streamer}</span> <span class="icone-batalha">⚔️</span> <span class="sem-oponente">${oponente}</span></div>`;
        } else if (ehConfirmada) {
            batalhaTexto = `<div class="card-batalha-nome"><span class="nome-streamer">${b.streamer}</span> <span class="icone-batalha">⚔️</span> <span class="nome-oponente">${oponente}</span></div>`;
        }

        // Detalhes (link e meta)
        let detalhesHtml = "";
        if (link || meta) {
            detalhesHtml = `<div class="card-detalhes">
                ${link ? `<div class="detalhe-item">🔗 <a href="${link}" target="_blank">Perfil</a></div>` : ""}
                ${meta ? `<div class="detalhe-item">💎 Meta: ${meta}</div>` : ""}
            </div>`;
        }

        return `
        <div class="agenda-card ${classeCard}">
            <div class="card-cabecalho">
                <div class="card-data">${dataExibicao}</div>
                <div class="etiqueta ${classeEtiqueta}">${etiquetaTexto}</div>
            </div>
            <div class="card-corpo">${batalhaTexto}</div>
            ${detalhesHtml}
        </div>`;
    }).join("");
}

// ====================== CARREGAR BATALHAS ======================
async function carregarBatalhas() {
    try {
        const resposta = await fetch(LINK_APPS_SCRIPT + "?acao=lerBatalhas");
        const dados = await resposta.json();
        if (dados.batalhas && Array.isArray(dados.batalhas)) {
            batalhas = dados.batalhas.slice(1).map(linha => ({
                numeroDia: linha[COL.NUMERO_DIA],
                data: linha[COL.DATA],
                horaInicio: converterHora(linha[COL.HORA_INICIO]),
                horaFim: converterHora(linha[COL.HORA_FIM]),
                streamer: (linha[COL.STREAMER] || "").toString().trim().toUpperCase(),
                oponente: (linha[COL.OPONENTE] || "").toString().trim().toUpperCase(),
                link: linha[COL.LINK] || "",
                meta: linha[COL.META] || "",
                situacao: (linha[COL.SITUACAO] || "").toString().trim().toUpperCase(),
                banner: linha[COL.BANNER] || "",
                video: linha[COL.VIDEO] || ""
            }));
        }
    } catch (erro) {
        console.error("Erro ao carregar batalhas:", erro);
    }
}

function converterHora(valor) {
    if (!valor && valor !== 0) return "";
    const num = Number(valor);
    if (isNaN(num)) return String(valor);
    const h = Math.floor(num / 100);
    const m = num % 100;
    return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
}

function converterParaMinutos(horario) {
    if (!horario || horario === "") return 9999;
    const [h, m] = String(horario).split(":").map(Number);
    return h * 60 + (m || 0);
}

function formatarData(data) {
    if (typeof data === "string") return data;
    return `${String(data.getDate()).padStart(2,"0")}/${String(data.getMonth()+1).padStart(2,"0")}/${data.getFullYear()}`;
}

function verificarFeriado(data) {
    const mesDia = `${String(data.getMonth()+1).padStart(2,"0")}-${String(data.getDate()).padStart(2,"0")}`;
    return FERIADOS[mesDia] || null;
}

function extrairDataBatalha(dataTexto, anoRef, mesRef) {
    if (!dataTexto) return null;
    const d = new Date(dataTexto);
    if (!isNaN(d.getTime())) return d;
    const match = dataTexto.match(/(\d{1,2})/);
    if (match) return new Date(anoRef, mesRef, parseInt(match[1], 10));
    return null;
}

// ====================== REGRAS DE BLOQUEIO ======================
function verificarBloqueio(horario, dataAlvo) {
    const horarioMin = converterParaMinutos(horario);
    const diaSemana = dataAlvo.getDay();

    if (diaSemana === 0) return { bloqueado: true, motivo: "🚫 DOMINGO — Sem agendamento" };
    const feriado = verificarFeriado(dataAlvo);
    if (feriado) return { bloqueado: true, motivo: `🎉 FERIADO: ${feriado}` };

    const diaAlvo = dataAlvo.getDate();
    const mesAlvo = dataAlvo.getMonth();
    const anoAlvo = dataAlvo.getFullYear();

    const batalhasDoDia = batalhas.filter(b => {
        const d = extrairDataBatalha(b.data, anoAlvo, mesAlvo);
        return d && d.getDate() === diaAlvo && d.getMonth() === mesAlvo && d.getFullYear() === anoAlvo;
    });

    for (const b of batalhasDoDia) {
        const inicio = converterParaMinutos(b.horaInicio);
        const fim = converterParaMinutos(b.horaFim) || inicio + 60;
        const situacao = b.situacao;
        const ehBloqueio = ["CAMPANHA", "CONFIRMADA", "CONFIMADO", "FALTA OPONENTE"].includes(situacao);
        const horarioConflita = horarioMin >= inicio && horarioMin < fim;

        if (ehBloqueio && horarioConflita) {
            let tipo = "";
            if (situacao === "CAMPANHA") tipo = "⛔ CAMPANHA";
            else if (["CONFIRMADA", "CONFIMADO"].includes(situacao)) tipo = "⛔ CONFIRMADA";
            else if (situacao === "FALTA OPONENTE") tipo = "⏳ FALTA OPONENTE";
            return { bloqueado: true, motivo: `${tipo} às ${b.horaInicio}` };
        }
    }
    return { bloqueado: false, motivo: "✅ HORÁRIO DISPONÍVEL!" };
}

// ====================== VERIFICAR DISPONIBILIDADE ======================
function verificarDisponibilidade() {
    const input = document.getElementById("inputHorario");
    const horario = input.value;
    if (!horario) { mostrarToast("⚠️ Selecione um horário"); return; }

    const res = verificarBloqueio(horario, dataSelecionada);
    const statusDiv = document.getElementById("statusHorario");
    const textoDiv = document.getElementById("textoStatusHorario");

    statusDiv.classList.add("visivel");
    textoDiv.textContent = res.motivo;
    statusDiv.className = "status-horario visivel " + (res.bloqueado ? "bloqueado" : "livre");

    if (!res.bloqueado) {
        horarioEscolhido = horario;
        document.getElementById("formStreamer").value = nomeUsuario;
        document.getElementById("formData").value = formatarData(dataSelecionada);
        document.getElementById("formHorario").value = horario;
        document.getElementById("secaoFormulario").classList.add("visivel");
        window.scrollTo({ top: document.getElementById("secaoFormulario").offsetTop - 20, behavior: "smooth" });
    } else {
        horarioEscolhido = null;
        document.getElementById("secaoFormulario").classList.remove("visivel");
    }
}

// ====================== RENDERIZAR CALENDÁRIO ======================
function renderizarCalendario() {
    const ano = dataAtual.getFullYear();
    const mes = dataAtual.getMonth();
    const nomesMeses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
    document.getElementById("nomeMes").textContent = `${nomesMeses[mes]} ${ano}`;

    renderizarAgendaDoStreamer(); // ← Atualiza agenda ao mudar mês!

    const primeiroDia = new Date(ano, mes, 1).getDay();
    const totalDias = new Date(ano, mes + 1, 0).getDate();
    const hoje = new Date(); hoje.setHours(0,0,0,0);

    let html = "";
    for (let i = 0; i < primeiroDia; i++) html += `<div class="dia vazio"></div>`;

    for (let dia = 1; dia <= totalDias; dia++) {
        const dataDia = new Date(ano, mes, dia);
        const ehHoje = dataDia.getTime() === hoje.getTime();
        const ehPassado = dataDia < hoje;
        const diaSemana = dataDia.getDay();
        const feriado = verificarFeriado(dataDia);

        let classe = "disponivel", statusTexto = "";
        if (feriado) { classe = "feriado"; statusTexto = "🎉"; }
        else if (diaSemana === 0) { classe = "domingo"; statusTexto = "Dom"; }
        else {
            const st = verificarStatusDia(dia, mes, ano);
            if (st === "CAMPANHA") { classe = "campanha"; statusTexto = "⚠️ Camp"; }
            else if (st === "FALTA OPONENTE") { classe = "falta-oponente"; statusTexto = "⏳ Op"; }
            else if (["CONFIRMADA", "CONFIMADO"].includes(st)) { classe = "confirmada"; statusTexto = "✅ Ok"; }
            else if (ehPassado) { classe = "bloqueado"; }
        }

        const clicavel = ["disponivel", "campanha", "falta-oponente"].includes(classe) && !ehPassado;
        const estilo = ehHoje ? "border:2px solid var(--verde);font-weight:bold;" : "";

        html += `<div class="dia ${classe}" ${clicavel ? `onclick="selecionarDia(${ano},${mes},${dia})"` : ""} style="${estilo}">${dia}${statusTexto ? `<div class="status-mini">${statusTexto}</div>` : ""}</div>`;
    }

    document.getElementById("gradeDias").innerHTML = html;
    document.getElementById("secaoHorario").classList.remove("visivel");
    document.getElementById("secaoFormulario").classList.remove("visivel");
    horarioEscolhido = null;
}

function verificarStatusDia(dia, mes, ano) {
    const batalhasDoDia = batalhas.filter(b => {
        const d = extrairDataBatalha(b.data, ano, mes);
        return d && d.getDate() === dia && d.getMonth() === mes && d.getFullYear() === ano;
    });
    for (const b of batalhasDoDia) if (b.situacao === "CAMPANHA") return "CAMPANHA";
    for (const b of batalhasDoDia) if (b.situacao === "FALTA OPONENTE") return "FALTA OPONENTE";
    for (const b of batalhasDoDia) if (["CONFIRMADA", "CONFIMADO"].includes(b.situacao)) return "CONFIRMADA";
    return "DISPONÍVEL";
}

// ====================== SELECIONAR DIA ======================
window.selecionarDia = function(ano, mes, dia) {
    dataSelecionada = new Date(ano, mes, dia);
    document.getElementById("dataSelecionada").textContent = formatarData(dataSelecionada);
    document.getElementById("inputHorario").value = "";
    document.getElementById("statusHorario").classList.remove("visivel");
    document.getElementById("secaoFormulario").classList.remove("visivel");
    horarioEscolhido = null;

    const feriado = verificarFeriado(dataSelecionada);
    if (feriado) { mostrarToast(`🎉 ${feriado}`); return; }
    if (dataSelecionada.getDay() === 0) { mostrarToast("🚫 Domingo"); return; }

    document.getElementById("secaoHorario").classList.add("visivel");
    window.scrollTo({ top: document.getElementById("secaoHorario").offsetTop - 20, behavior: "smooth" });
};

function voltarAoCalendario() {
    document.getElementById("secaoHorario").classList.remove("visivel");
    document.getElementById("secaoFormulario").classList.remove("visivel");
    horarioEscolhido = null;
    dataSelecionada = null;
    window.scrollTo({ top: 0, behavior: "smooth" });
}

// ====================== ENVIAR SOLICITAÇÃO ======================
async function enviarSolicitacao() {
    const link = document.getElementById("formLink").value.trim() || "";
    const meta = document.getElementById("formMeta").value.trim() || "";
    const artes = [];
    if (document.getElementById("arteFoto").checked) artes.push("📸 Foto");
    if (document.getElementById("arteVideo").checked) artes.push("🎬 Vídeo");
    const tipoArte = artes.length ? artes.join(" + ") : "Não informado";
    const dataStr = formatarData(dataSelecionada);

    if (!horarioEscolhido) { mostrarToast("⚠️ Verifique o horário primeiro"); return; }

    const dados = {
        streamer: nomeUsuario,
        data: dataSelecionada.toISOString(),
        horaInicio: horarioEscolhido,
        link: link,
        meta: meta,
        tipoArte: tipoArte
    };

    try {
        mostrarToast("⏳ Enviando...");
        await fetch(LINK_APPS_SCRIPT, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(dados)
        });

        const mensagem = `⚔️ NOVA SOLICITAÇÃO DE BATALHA

👤 STREAMER: ${nomeUsuario}
📅 DATA: ${dataStr}
⏰ HORÁRIO: ${horarioEscolhido}
🔗 LINK: ${link || "Não informado"}
💎 META: ${meta || "Não informada"}
🎨 ARTE: ${tipoArte}

📊 Situação: ⏳ FALTA OPONENTE

---
PADRONIZA ASSESSORIA 🛡️`;

        window.open(`https://wa.me/${WHATSAPP_AGENCIA}?text=${encodeURIComponent(mensagem)}`, "_blank");
        mostrarToast("✅ Enviado! Abrindo WhatsApp...");
        setTimeout(() => location.reload(), 3000);

    } catch (erro) {
        mostrarToast("⚠️ Erro — tente novamente");
        console.error(erro);
    }
}

function mostrarToast(texto) {
    const t = document.getElementById("toast");
    t.textContent = texto;
    t.style.display = "block";
    setTimeout(() => t.style.display = "none", 3500);
}
