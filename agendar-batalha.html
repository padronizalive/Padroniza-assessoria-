<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendar Batalha — Padroniza Assessoria</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    :root {
      --verde: #00ff9c; --amarelo: #ffd700; --azul: #00a8ff; --branco: #f0f0f0;
      --vermelho: #ff4444; --fundo: #0b1020; --painel: #11182c;
      --borda: #2a3a5a; --texto: #e6efff; --cinza: #7a8ba8; --roxo: #7457ff;
      --verde-whats: #25d366;
    }
    body { background: var(--fundo); color: var(--texto); min-height: 100vh; padding: 20px 12px; }
    .container { max-width: 460px; margin: 0 auto; }

    /* 🔐 TELA DE LOGIN */
    .login-box {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 80vh; text-align: center; padding: 40px 20px;
    }
    .logo { font-size: 32px; font-weight: 800; color: var(--verde); margin-bottom: 20px; }
    .login-box h2 { color: var(--amarelo); margin-bottom: 20px; font-size: 22px; }
    .campo-form {
      width: 100%; max-width: 360px; padding: 16px; border-radius: 10px;
      border: 1px solid var(--borda); background: #17213a; color: var(--texto);
      font-size: 16px; margin-bottom: 14px;
    }
    .btn-acao {
      width: 100%; max-width: 360px; padding: 16px; border-radius: 10px;
      border: none; font-weight: bold; cursor: pointer; font-size: 17px;
      background: linear-gradient(90deg, #00c853, #00ff9c); color: #000;
    }
    .mensagem { margin-top: 16px; font-size: 15px; min-height: 24px; }
    .erro { color: var(--vermelho); }
    .sucesso { color: var(--verde); }

    /* 📅 CALENDÁRIO */
    .cal-topo {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; padding: 16px; background: var(--painel);
      border-radius: 12px; border: 1px solid var(--borda);
    }
    .btn-mes {
      background: transparent; border: 2px solid var(--verde); color: var(--verde);
      width: 44px; height: 44px; border-radius: 10px; font-size: 20px; cursor: pointer;
      transition: all 0.25s;
    }
    .btn-mes:hover { background: var(--verde); color: #000; }
    .nome-mes { font-size: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

    .dias-semana {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 8px;
    }
    .cab-semana { text-align: center; font-size: 12px; font-weight: 600; color: var(--cinza); padding: 6px; text-transform: uppercase; }

    .calendario {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 28px;
    }
    .dia {
      aspect-ratio: 1; border-radius: 10px; border: 2px solid transparent;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--painel); border-color: var(--borda); transition: all 0.2s;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .dia.vazio { background: transparent; border: none; cursor: default; }
    .dia-num { font-size: 16px; font-weight: 700; line-height: 1; }

    /* 🎨 CORES DAS SITUAÇÕES */
    .disponivel { background: rgba(0,255,156,0.12); border-color: var(--verde); color: var(--verde); }
    .campanha { background: rgba(255,215,0,0.15); border-color: var(--amarelo); color: var(--amarelo); }
    .domingo, .feriado { background: rgba(255,68,68,0.15); border-color: var(--vermelho); color: var(--vermelho); opacity: 0.85; }
    .falta-oponente { background: rgba(0,168,255,0.15); border-color: var(--azul); color: var(--azul); }
    .confirmado { background: rgba(240,240,240,0.12); border-color: var(--branco); color: var(--branco); }

    /* 📋 LISTAS DE BATALHAS */
    .agenda-pessoal, .agenda-geral {
      margin-bottom: 24px; padding: 16px; background: var(--painel);
      border-radius: 12px; border: 1px solid var(--borda);
    }
    .agenda-pessoal { border-color: var(--verde); border-width: 2px; }
    .agenda-pessoal h3 { color: var(--verde); margin-bottom: 12px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
    .agenda-geral h3 { color: var(--azul); margin-bottom: 12px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
    .item-batalha {
      padding: 16px; border-radius: 12px; margin-bottom: 14px; border-left: 4px solid;
      background: rgba(255,255,255,0.03);
    }
    .item-batalha strong { font-size: 16px; display: block; margin-bottom: 8px; }
    .item-batalha .vs { font-size: 15px; color: var(--cinza); margin-bottom: 10px; }
    .divisoria { border-bottom: 1px dashed var(--borda); margin: 10px 0; }
    
    /* 🎨 ITENS DE MATERIAIS — SÓ APARECEM NAS MINHAS BATALHAS */
    .materiais-area { margin-top: 10px; padding-top: 12px; border-top: 1px dashed var(--borda); }
    .material-item {
      display: flex; align-items: center; gap: 10px; padding: 12px 14px;
      border-radius: 10px; font-size: 14px; font-weight: 500; margin-bottom: 10px;
      transition: 0.2s;
    }
    .material-item.disponivel {
      background: rgba(255,215,0,0.15); color: var(--amarelo); border: 1px solid var(--amarelo);
      cursor: pointer; text-decoration: none;
    }
    .material-item.disponivel:hover { background: var(--amarelo); color: #000; }
    .material-item.indisponivel {
      background: rgba(255,255,255,0.03); color: var(--cinza); border: 1px dashed var(--cinza);
    }
    .material-item.video-disponivel {
      background: rgba(116,87,255,0.15); color: var(--roxo); border: 1px solid var(--roxo);
    }
    .material-item.video-disponivel:hover { background: var(--roxo); color: #fff; }
    
    /* 💬 BOTÃO WHATSAPP */
    .btn-whats {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 16px; border-radius: 10px; font-size: 14px; font-weight: 600;
      text-decoration: none; margin-top: 6px;
      background: rgba(37,211,102,0.15); color: var(--verde-whats); 
      border: 1px solid var(--verde-whats); transition: 0.2s;
    }
    .btn-whats:hover { background: var(--verde-whats); color: #fff; }
    
    .sem-batalha { padding: 30px 20px; color: var(--cinza); font-size: 15px; text-align: center; line-height: 1.6; }
    .contador { font-size: 13px; color: var(--cinza); margin-bottom: 12px; }
    .conteudo { display: none; }
    .conteudo.visivel { display: block; }
  </style>
</head>
<body>
<div class="container">

  <!-- 🔑 TELA DE LOGIN -->
  <div class="login-box" id="telaLogin">
    <div class="logo">⚔️ Padroniza</div>
    <h2>Agenda de Batalhas</h2>
    <input type="text" class="campo-form" id="usuarioAcesso" placeholder="Digite seu nome de usuário">
    <button class="btn-acao" onclick="verificarAcesso()">🔍 ACESSAR AGENDA</button>
    <div class="mensagem" id="mensagemAcesso"></div>
  </div>

  <!-- ✅ CONTEÚDO DA AGENDA -->
  <div class="conteudo" id="conteudoAgenda">
    <div class="cal-topo">
      <button class="btn-mes" id="btnAnterior">◀</button>
      <h2 class="nome-mes" id="nomeMes"></h2>
      <button class="btn-mes" id="btnProximo">▶</button>
    </div>

    <div class="dias-semana">
      <div class="cab-semana">Dom</div><div class="cab-semana">Seg</div><div class="cab-semana">Ter</div>
      <div class="cab-semana">Qua</div><div class="cab-semana">Qui</div><div class="cab-semana">Sex</div><div class="cab-semana">Sáb</div>
    </div>

    <div class="calendario" id="calendario"></div>

    <div class="agenda-pessoal">
      <h3>👤 Minhas Batalhas — <span id="nomeUsuarioExibicao"></span></h3>
      <div id="minhasBatalhas" class="sem-batalha">Carregando...</div>
    </div>

    <div class="agenda-geral">
      <h3>📋 Todas as Batalhas</h3>
      <div class="contador" id="contadorGeral"></div>
      <div id="todasBatalhas" class="sem-batalha"></div>
    </div>
  </div>
</div>

<script>
// 🔗 PLANILHA DE CONTROLE — MESMA DO INDEX
const LINK_PLANILHA_CONTROLE = "https://docs.google.com/spreadsheets/d/1R9eUsqF4kA0y22ryMUIsvGolBfk3-XwZ5R-RVpBiZA4/gviz/tq?tqx=out:json";
// 🔗 APPS SCRIPT DA PLANILHA DE BATALHAS
const LINK_APPSCRIPT_BATALHAS = "https://script.google.com/macros/s/AKfycbygvZq1vAaSRy-eBkrWe73Y7x1GX5c5nj1untYB5T-8ErAntowbMVLvqmTO7uZ9cujH4A/exec";
// 📲 WHATSAPP DA AGÊNCIA
const WHATSAPP_AGENCIA = "5569981478873";

let dadosControle = [];
let usuarioLogado = null;
let mesAtual = new Date().getMonth() + 1;
let anoAtual = new Date().getFullYear();
let batalhasMes = [];
const NOMES_MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

// 🚀 INICIALIZA
window.onload = async function() {
  await carregarPlanilhaControle();
  const params = new URLSearchParams(window.location.search);
  const nomeDaUrl = (params.get("usuario") || "").trim().toLowerCase();
  if (nomeDaUrl) {
    document.getElementById("usuarioAcesso").value = nomeDaUrl;
    verificarAcesso();
  }
};

// 📖 CARREGA PLANILHA DE CONTROLE
async function carregarPlanilhaControle(){
  try{
    const res = await fetch(LINK_PLANILHA_CONTROLE);
    let txt = await res.text();
    txt = txt.substring(47, txt.length - 2);
    const json = JSON.parse(txt);
    dadosControle = json.table.rows.slice(1).map(linha => {
      const c = linha.c || [];
      return {
        usuario: ((c[0]||{}).v||"").toString().trim().toLowerCase(),
        status: ((c[1]||{}).v||"").toString().trim().toUpperCase()
      };
    });
  }catch(e){console.error("Erro planilha controle:", e)}
}

// 🔑 VERIFICA ACESSO
async function verificarAcesso(){
  const usuario = document.getElementById("usuarioAcesso").value.trim().toLowerCase();
  const msg = document.getElementById("mensagemAcesso");
  
  if (!usuario) {
    msg.innerHTML = '<span class="erro">❌ Digite seu nome de usuário</span>';
    return;
  }

  const streamer = dadosControle.find(s => s.usuario === usuario && s.status === "APROVADO");
  
  if (streamer) {
    usuarioLogado = streamer.usuario;
    msg.innerHTML = '<span class="sucesso">✅ Aprovado! Carregando agenda...</span>';
    document.getElementById("telaLogin").style.display = "none";
    document.getElementById("conteudoAgenda").classList.add("visivel");
    document.getElementById("nomeUsuarioExibicao").textContent = usuarioLogado;
    await carregarBatalhas();
  } else {
    msg.innerHTML = '<span class="erro">❌ Usuário não encontrado ou não aprovado</span>';
  }
}

// 🔄 NORMALIZA NOME
function normalizarNome(nome) {
  if (!nome) return "";
  return nome.toString().trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, "");
}

// ✅ VERIFICA SE É BATALHA DELE
function ehMinhaBatalha(b) {
  const eu = normalizarNome(usuarioLogado);
  const s = normalizarNome(b.streamer);
  const o = normalizarNome(b.oponente);
  return s === eu || o === eu;
}

// 📖 CARREGA BATALHAS DO MÊS
async function carregarBatalhas() {
  try {
    const res = await fetch(`${LINK_APPSCRIPT_BATALHAS}?mes=${mesAtual}&ano=${anoAtual}`);
    const dados = await res.json();
    batalhasMes = dados.batalhas || [];
  } catch (e) {
    console.error("Erro ao carregar batalhas:", e);
    batalhasMes = [];
  }
  renderizarCalendario();
  renderizarAgendas();
}

// 📅 RENDERIZA CALENDÁRIO
function renderizarCalendario() {
  document.getElementById("nomeMes").textContent = `${NOMES_MESES[mesAtual-1].toUpperCase()} ${anoAtual}`;
  const cal = document.getElementById("calendario");
  cal.innerHTML = "";
  
  const primeiroDia = new Date(anoAtual, mesAtual-1, 1).getDay();
  const totalDias = new Date(anoAtual, mesAtual, 0).getDate();

  for (let i = 0; i < primeiroDia; i++) cal.innerHTML += `<div class="dia vazio"></div>`;

  for (let dia = 1; dia <= totalDias; dia++) {
    const dataAlvo = `${anoAtual}-${String(mesAtual).padStart(2,"0")}-${String(dia).padStart(2,"0")}`;
    const bd = batalhasMes.filter(b => b.data && b.data.substring(0,10) === dataAlvo);
    
    let classe = "disponivel";
    if (bd.length > 0) {
      const sts = bd.map(b => (b.situacao || "").toUpperCase());
      if (sts.some(x => x.includes("DOMINGO") || x.includes("FERIADO"))) classe = "domingo";
      else if (sts.some(x => x.includes("CAMPANHA"))) classe = "campanha";
      else if (sts.some(x => x.includes("FALTA OPONENTE"))) classe = "falta-oponente";
      else if (sts.some(x => x.includes("CONFIRMADO") || x.includes("CONFIRMADA"))) classe = "confirmado";
    }
    cal.innerHTML += `<div class="dia ${classe}"><span class="dia-num">${dia}</span></div>`;
  }
}

// 📋 RENDERIZA LISTAS
function renderizarAgendas() {
  const minhas = batalhasMes.filter(ehMinhaBatalha);
  
  document.getElementById("minhasBatalhas").innerHTML = minhas.length 
    ? minhas.map(b => gerarItem(b, true)).join("")
    : `<div class="sem-batalha">Nenhuma batalha encontrada para você.<br>Escolha um dia disponível para solicitar!</div>`;

  document.getElementById("contadorGeral").textContent = `Total: ${batalhasMes.length} batalhas`;
  document.getElementById("todasBatalhas").innerHTML = batalhasMes.length
    ? batalhasMes.map(b => gerarItem(b, false)).join("")
    : `<div class="sem-batalha">Nenhuma batalha agendada ainda.</div>`;
}

// 📝 GERA ITEM DE BATALHA — SÓ MOSTRA MATERIAIS NAS MINHAS BATALHAS!
function gerarItem(b, ehMinha) {
  const data = b.data ? b.data.split("-").reverse().join("/") : "Sem data";
  let cor = "#7a8ba8", icone = "📌";
  const s = (b.situacao || "").toUpperCase();
  
  if (s.includes("FALTA OPONENTE")) { cor = "#00a8ff"; icone = "⏳"; }
  else if (s.match(/CONFIRMADA?/)) { cor = "#f0f0f0"; icone = "✅"; }
  else if (s.includes("CAMPANHA")) { cor = "#ffd700"; icone = "📢"; }
  else if (s.includes("DISPONÍVEL")) { cor = "#00ff9c"; icone = "✅"; }

  // 🖼️ BANNER — Coluna Q
  const banner = (b.banner || "").trim();
  const temBanner = banner.length > 5;
  
  // 🎥 VÍDEO DIVULGAÇÃO — Coluna R
  const video = (b.video || "").trim();
  const temVideo = video.length > 5;

  // 📲 MENSAGEM WHATSAPP — texto personalizado
  const msgWpp = encodeURIComponent("Olá! Tenho uma dúvida sobre minha batalha. Podem me ajudar? 💜");

  // 🏗️ ÁREA DE MATERIAIS — SÓ APARECE NAS MINHAS BATALHAS!
  let htmlMateriais = "";
  if (ehMinha) {
    htmlMateriais = `<div class="materiais-area">`;
    
    // Banner — SEMPRE aparece, com ou sem link
    htmlMateriais += temBanner
      ? `<a href="${banner}" target="_blank" class="material-item disponivel">🖼️ Ver Material Banner</a>`
      : `<div class="material-item indisponivel">🖼️ Seu Material Banner aparecerá aqui</div>`;
    
    // Vídeo — SEMPRE aparece, com ou sem link
    htmlMateriais += temVideo
      ? `<a href="${video}" target="_blank" class="material-item disponivel video-disponivel">🎥 Ver Material Vídeo Divulgação</a>`
      : `<div class="material-item indisponivel">🎥 Seu Material Vídeo Divulgação aparecerá aqui</div>`;
    
    // Botão WhatsApp — SEMPRE aparece nas minhas batalhas
    htmlMateriais += `<a href="https://wa.me/${WHATSAPP_AGENCIA}?text=${msgWpp}" target="_blank" class="btn-whats">💬 Dúvida? Fale com a Padroniza</a>`;
    
    htmlMateriais += `</div>`;
  }

  return `<div class="item-batalha" style="border-color:${cor}">
    <strong>${icone} ${data} — ${b.situacao || "Disponível"}</strong>
    <div class="vs">${b.streamer || "-"} vs ${b.oponente || "-"}</div>
    ${htmlMateriais}
  </div>`;
}

// ◀▶ NAVEGAÇÃO ENTRE MESES
document.getElementById("btnAnterior").onclick = () => {
  mesAtual--; if (mesAtual < 1) { mesAtual = 12; anoAtual--; }
  carregarBatalhas();
};
document.getElementById("btnProximo").onclick = () => {
  mesAtual++; if (mesAtual > 12) { mesAtual = 1; anoAtual++; }
  carregarBatalhas();
};
</script>
</body>
</html>
