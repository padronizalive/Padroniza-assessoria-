<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚔️ Calendário de Batalhas — Padroniza Assessoria</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
    :root {
      --bg-principal: #0f1020; --bg-card: #181a30; --texto: #fff; --texto-claro: #9999aa;
      --borda: #2a2d50; --disponivel: #00ff88; --confirmada: #ffffff; --oponente: #00ccff;
      --campanha: #ffcc00; --bloqueado: #ff3355;
    }
    body { background: var(--bg-principal); min-height: 100vh; padding: 20px 16px; color: var(--texto); }
    .container { max-width: 420px; margin: 0 auto; }

    .agenda-pessoal {
      background: linear-gradient(135deg, #1a1a40, #121230);
      padding: 20px; border-radius: 20px; border: 2px solid var(--disponivel); margin-bottom: 24px;
    }
    .agenda-pessoal .titulo { font-size: 18px; font-weight: 900; margin-bottom: 16px; color: var(--disponivel); text-transform: uppercase; }
    .item-pessoal {
      background: rgba(255,255,255,0.05); padding: 12px; border-radius: 10px;
      margin-bottom: 8px; border-left: 4px solid;
    }
    .item-pessoal.campanha { border-color: var(--campanha); }
    .item-pessoal.confirmada { border-color: var(--confirmada); }
    .item-pessoal.oponente { border-color: var(--oponente); }
    .sem-dados { color: var(--texto-claro); text-align: center; padding: 15px; }

    .cabecalho-mes { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .btn-seta {
      width: 56px; height: 56px; background: transparent; border: 3px solid var(--disponivel);
      border-radius: 12px; color: var(--disponivel); font-size: 22px; cursor: pointer;
    }
    .nome-mes { font-size: 26px; font-weight: 900; text-transform: uppercase; }

    .cabecalho-semana { display: grid; grid-template-columns: repeat(7,1fr); gap: 8px; margin-bottom: 12px; }
    .nome-semana { text-align: center; font-size: 14px; color: var(--texto-claro); text-transform: uppercase; }

    .grade {
      display: grid; grid-template-columns: repeat(7,1fr); gap: 10px;
      background: var(--bg-card); padding: 18px; border-radius: 24px; border: 2px solid var(--borda); margin-bottom: 24px;
    }
    .dia {
      aspect-ratio: 1; border-radius: 12px; border: 4px solid; display: flex; flex-direction: column;
      align-items: center; justify-content: center; font-weight: 800; font-size: 20px; cursor: pointer;
      transition: transform .2s; background: rgba(0,0,0,0.25);
    }
    .dia:hover { transform: scale(1.08); }
    .dia.vazio { border: none; background: transparent; cursor: default; }
    .dia.disponivel { border-color: var(--disponivel); color: var(--disponivel); }
    .dia.campanha { border-color: var(--campanha); color: var(--campanha); }
    .dia.confirmada { border-color: var(--confirmada); color: var(--confirmada); }
    .dia.oponente { border-color: var(--oponente); color: var(--oponente); }
    .dia.bloqueado { border-color: var(--bloqueado); color: var(--bloqueado); cursor: not-allowed; }
    .tag { font-size: 10px; font-weight: 700; margin-top: 2px; text-transform: uppercase; }

    .outras {
      background: var(--bg-card); padding: 20px; border-radius: 20px; border: 2px solid var(--borda);
    }
    .outras .titulo { font-size: 16px; font-weight: 800; margin-bottom: 16px; text-transform: uppercase; }
    .item-outro {
      padding: 10px 12px; border-radius: 8px; margin-bottom: 8px;
      background: rgba(255,255,255,0.03); border-left: 3px solid; font-size: 13px;
    }
    .item-outro.campanha { border-left-color: var(--campanha); }
    .item-outro.confirmada { border-left-color: var(--confirmada); }
    .item-outro.oponente { border-left-color: var(--oponente); }

    .erro { background: rgba(255,51,85,0.2); border: 2px solid var(--bloqueado); padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
  </style>
</head>
<body>
<div class="container">
  <div class="agenda-pessoal">
    <h3 class="titulo">👤 MINHA AGENDA — <span id="nomeUsuario"></span></h3>
    <div id="minhaAgenda"></div>
  </div>

  <div class="cabecalho-mes">
    <button class="btn-seta" onclick="mudarMes(-1)">◀</button>
    <h2 class="nome-mes" id="nomeMes"></h2>
    <button class="btn-seta" onclick="mudarMes(1)">▶</button>
  </div>
  <div class="cabecalho-semana">
    <div class="nome-semana">Dom</div><div class="nome-semana">Seg</div><div class="nome-semana">Ter</div>
    <div class="nome-semana">Qua</div><div class="nome-semana">Qui</div><div class="nome-semana">Sex</div><div class="nome-semana">Sáb</div>
  </div>
  <div class="grade" id="gradeCalendario"></div>

  <div class="outras">
    <h3 class="titulo">🌍 TODAS AS BATALHAS & CAMPANHAS</h3>
    <div id="todasBatalhas"></div>
  </div>
</div>

<script>
const LINK = "https://script.google.com/macros/s/AKfycbx6Bpw0OdmfdznHovpbCNhJmUSLeWUi5ZaWeVGqHks5Iy4PC1M-E32EXqUqcCc7L1oP/exec";

const params = new URLSearchParams(window.location.search);
const NOME_USUARIO = (params.get("usuario") || "").trim().toUpperCase();
document.getElementById("nomeUsuario").textContent = NOME_USUARIO || "Convidado";

let mesAtual = new Date().getMonth() + 1;
let anoAtual = new Date().getFullYear();
let batalhas = [];

const NOMES_MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

function normalizarNome(nome) {
  return nome.toUpperCase().replace(/\s+/g, "").replace(/[^A-Z0-9]/g, "").trim();
}

function definirClasse(situacao) {
  if (!situacao) return "disponivel";
  const s = situacao.toUpperCase();
  if (s.includes("CAMPANHA")) return "campanha";
  if (s.includes("CONFIRMADA") || s.includes("CONFIRMADO") || s.includes("CONFIMADO")) return "confirmada";
  if (s.includes("FALTA OPONENTE")) return "oponente";
  if (s.includes("DOMINGO") || s.includes("FERIADO")) return "bloqueado";
  return "disponivel";
}

async function carregar() {
  console.log("🔄 Carregando mês:", mesAtual, anoAtual);
  try {
    const res = await fetch(`${LINK}?acao=lerBatalhas&mes=${mesAtual}&ano=${anoAtual}`);
    const dados = await res.json();
    console.log("📥 Dados recebidos:", dados);
    
    if (dados.status !== "sucesso") throw new Error(dados.mensagem);
    batalhas = dados.batalhas || [];
    console.log("✅ Total batalhas:", batalhas.length);
  } catch (e) {
    console.error("❌ Erro:", e);
    document.getElementById("gradeCalendario").innerHTML = `<div class="erro">❌ ${e.message}</div>`;
    return;
  }
  
  renderizarCalendario();
  renderizarMinhaAgenda();
  renderizarTodas();
}

function renderizarCalendario() {
  document.getElementById("nomeMes").textContent = `${NOMES_MESES[mesAtual - 1].toUpperCase()} ${anoAtual}`;
  const grade = document.getElementById("gradeCalendario");
  grade.innerHTML = "";

  const primeiroDia = new Date(anoAtual, mesAtual - 1, 1).getDay();
  const ultimoDia = new Date(anoAtual, mesAtual, 0).getDate();

  for (let i = 0; i < primeiroDia; i++) {
    const d = document.createElement("div");
    d.className = "dia vazio";
    grade.appendChild(d);
  }

  for (let dia = 1; dia <= ultimoDia; dia++) {
    const dataStr = `${anoAtual}-${String(mesAtual).padStart(2,"0")}-${String(dia).padStart(2,"0")}`;
    const diaSemana = new Date(anoAtual, mesAtual - 1, dia).getDay();
    const noDia = batalhas.filter(b => b.data === dataStr);

    let classe = "disponivel";
    let tag = "";
    let clicavel = true;

    if (diaSemana === 0) {
      classe = "bloqueado"; tag = "DOM"; clicavel = false;
    } else if (noDia.length > 0) {
      const situacoes = [...new Set(noDia.map(b => b.situacao))];
      if (situacoes.some(s => s.includes("CAMPANHA"))) { classe = "campanha"; tag = "CAMP"; }
      else if (situacoes.some(s => s.includes("CONFIRM") || s.includes("CONFIM"))) { classe = "confirmada"; tag = "✓"; }
      else if (situacoes.some(s => s.includes("FALTA OPONENTE"))) { classe = "oponente"; tag = "OP"; }
    }

    const div = document.createElement("div");
    div.className = `dia ${classe}`;
    if (!clicavel) div.style.cursor = "not-allowed";
    div.innerHTML = `<div>${dia}</div>${tag ? `<div class="tag">${tag}</div>` : ""}`;
    grade.appendChild(div);
  }
}

function renderizarMinhaAgenda() {
  const el = document.getElementById("minhaAgenda");
  if (!NOME_USUARIO) { el.innerHTML = `<div class="sem-dados">🔑 Acesse pela página principal</div>`; return; }
  
  const minhas = batalhas.filter(b => {
    if (!b.streamer) return false;
    return normalizarNome(b.streamer).includes(normalizarNome(NOME_USUARIO)) ||
           normalizarNome(NOME_USUARIO).includes(normalizarNome(b.streamer));
  });

  if (minhas.length === 0) {
    el.innerHTML = `<div class="sem-dados">📭 Nenhuma batalha encontrada</div>`;
    return;
  }

  minhas.sort((a,b) => a.data.localeCompare(b.data));
  el.innerHTML = minhas.map(b => {
    const classe = definirClasse(b.situacao);
    const icone = classe === "campanha" ? "⚠️" : classe === "confirmada" ? "⚔️" : "⏳";
    return `<div class="item-pessoal ${classe}">
      <strong>${icone} ${b.data.slice(8)}/${b.data.slice(5,7)}</strong> — ${b.situacao}
      ${b.horaInicio ? `<br><small>🕐 ${b.horaInicio}${b.horaFim ? ` — ${b.horaFim}` : ""}</small>` : ""}
    </div>`;
  }).join("");
}

function renderizarTodas() {
  const el = document.getElementById("todasBatalhas");
  const visiveis = batalhas.filter(b => b.situacao && b.situacao !== "DISPONÍVEL" && b.situacao !== "DISPONIVEL");
  
  if (visiveis.length === 0) {
    el.innerHTML = `<div class="sem-dados">Nenhuma batalha ou campanha registrada ✅</div>`;
    return;
  }

  visiveis.sort((a,b) => a.data.localeCompare(b.data));
  el.innerHTML = visiveis.map(b => {
    const classe = definirClasse(b.situacao);
    return `<div class="item-outro ${classe}">
      <strong>${b.data.slice(8)}/${b.data.slice(5,7)}</strong> — ${b.streamer || "CAMPANHA"}
      <br><small>${b.situacao}${b.horaInicio ? ` · ${b.horaInicio}` : ""}</small>
    </div>`;
  }).join("");
}

function mudarMes(delta) {
  mesAtual += delta;
  if (mesAtual < 1) { mesAtual = 12; anoAtual--; }
  if (mesAtual > 12) { mesAtual = 1; anoAtual++; }
  carregar();
}

document.addEventListener("DOMContentLoaded", carregar);
</script>
</body>
</html>
