<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda de Batalhas — Padroniza Assessoria</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    :root {
      --verde: #00ff9c; --amarelo: #ffd700; --azul: #00a8ff; --branco: #f0f0f0;
      --vermelho: #ff4444; --fundo: #0b1020; --painel: #11182c;
      --borda: #2a3a5a; --texto: #e6efff; --cinza: #7a8ba8;
    }
    body { background: var(--fundo); color: var(--texto); min-height: 100vh; padding: 20px 12px; }
    .container { max-width: 460px; margin: 0 auto; }

    .diagnostico {
      background: rgba(255,215,0,0.1); border: 1px solid var(--amarelo);
      padding: 14px; border-radius: 10px; margin-bottom: 20px; font-size: 13px;
      line-height: 1.8;
    }

    .bloqueio {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 60vh; text-align: center; padding: 40px 20px;
    }
    .bloqueio h2 { color: var(--vermelho); margin-bottom: 16px; font-size: 22px; }
    .bloqueio p { color: var(--cinza); line-height: 1.8; font-size: 16px; }
    .logo { font-size: 28px; font-weight: 800; color: var(--verde); margin-bottom: 20px; }

    .cal-topo {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; padding: 16px; background: var(--painel);
      border-radius: 12px; border: 1px solid var(--borda);
    }
    .btn-mes {
      background: transparent; border: 2px solid var(--verde); color: var(--verde);
      width: 44px; height: 44px; border-radius: 10px; font-size: 20px; cursor: pointer;
      transition: all 0.25s;
    }
    .btn-mes:hover { background: var(--verde); color: #000; }
    .nome-mes { font-size: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

    .dias-semana {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 8px;
    }
    .cab-semana { text-align: center; font-size: 12px; font-weight: 600; color: var(--cinza); padding: 6px; text-transform: uppercase; }

    .calendario {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 28px;
    }
    .dia {
      aspect-ratio: 1; border-radius: 10px; border: 2px solid transparent;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--painel); border-color: var(--borda); transition: all 0.2s;
    }
    .dia.vazio { background: transparent; border: none; }
    .dia-num { font-size: 18px; font-weight: 800; line-height: 1; }
    .dia-nome { font-size: 9px; color: var(--cinza); text-transform: uppercase; line-height: 1; margin-top: 2px; }

    .disponivel { background: rgba(0,255,156,0.12); border-color: var(--verde); }
    .disponivel .dia-num { color: var(--verde); }
    .campanha { background: rgba(255,215,0,0.15); border-color: var(--amarelo); }
    .campanha .dia-num { color: var(--amarelo); }
    .domingo, .feriado { background: rgba(255,68,68,0.15); border-color: var(--vermelho); opacity: 0.85; }
    .domingo .dia-num, .feriado .dia-num { color: var(--vermelho); }
    .falta-oponente { background: rgba(0,168,255,0.15); border-color: var(--azul); }
    .falta-oponente .dia-num { color: var(--azul); }
    .confirmado { background: rgba(240,240,240,0.12); border-color: var(--branco); }
    .confirmado .dia-num { color: var(--branco); }

    .agenda-pessoal, .agenda-geral {
      margin-bottom: 24px; padding: 16px; background: var(--painel);
      border-radius: 12px; border: 1px solid var(--borda);
    }
    .agenda-pessoal { border-color: var(--verde); border-width: 2px; }
    .agenda-pessoal h3 { color: var(--verde); margin-bottom: 12px; font-size: 16px; }
    .agenda-geral h3 { color: var(--azul); margin-bottom: 12px; font-size: 16px; }
    .item-batalha {
      padding: 12px; border-radius: 8px; margin-bottom: 10px; border-left: 3px solid;
      background: rgba(255,255,255,0.03);
    }
    .item-batalha strong { font-size: 14px; }
    .item-batalha small { font-size: 12px; color: var(--cinza); }
    .sem-batalha { padding: 20px; color: var(--cinza); font-size: 14px; text-align: center; line-height: 1.6; }
    .contador { font-size: 12px; color: var(--cinza); margin-bottom: 10px; }
    .conteudo { display: none; }
  </style>
</head>
<body>
<div class="container">
  <!-- 🔍 CAIXA DE DIAGNÓSTICO — MOSTRA TUDO QUE ESTÁ SENDO LIDO -->
  <div class="diagnostico" id="caixaDiagnostico">🔄 Carregando...</div>

  <!-- 🔒 TELA DE BLOQUEIO -->
  <div class="bloqueio" id="telaBloqueio">
    <div class="logo">⚔️ Padroniza</div>
    <h3>🔒 Acesso Restrito</h3>
    <p>Esta é uma área exclusiva para streamers da Padroniza Assessoria.<br>
    Acesse através do site oficial com seu nome de usuário.</p>
  </div>

  <!-- ✅ CONTEÚDO LIBERADO -->
  <div class="conteudo" id="conteudo">
    <div class="cal-topo">
      <button class="btn-mes" id="btnAnterior">◀</button>
      <h2 class="nome-mes" id="nomeMes"></h2>
      <button class="btn-mes" id="btnProximo">▶</button>
    </div>

    <div class="dias-semana">
      <div class="cab-semana">Dom</div><div class="cab-semana">Seg</div><div class="cab-semana">Ter</div>
      <div class="cab-semana">Qua</div><div class="cab-semana">Qui</div><div class="cab-semana">Sex</div><div class="cab-semana">Sáb</div>
    </div>

    <div class="calendario" id="calendario"></div>

    <div class="agenda-pessoal">
      <h3>👤 Minhas Batalhas</h3>
      <div id="minhasBatalhas" class="sem-batalha">Carregando...</div>
    </div>

    <div class="agenda-geral">
      <h3>📋 Todas as Batalhas</h3>
      <div class="contador" id="contadorGeral"></div>
      <div id="todasBatalhas" class="sem-batalha"></div>
    </div>
  </div>
</div>

<script>
// 🔗 LINK DO APPS SCRIPT
const LINK = "https://script.google.com/macros/s/AKfycbygvZq1vAaSRy-eBkrWe73Y7x1GX5c5nj1untYB5T-8ErAntowbMVLvqmTO7uZ9cujH4A/exec";

// 👤 PEGA NOME DA URL
const params = new URLSearchParams(window.location.search);
const NOME_USUARIO = (params.get("usuario") || "").trim();
const caixa = document.getElementById("caixaDiagnostico");

// 📋 MOSTRA O QUE ESTÁ SENDO LIDO — PRA COMPARAR!
caixa.innerHTML = `🔍 <strong>Nome recebido:</strong> "${NOME_USUARIO}"<br>
📏 <strong>Comprimento:</strong> ${NOME_USUARIO.length} caracteres<br>
🔑 <strong>Para busca:</strong> "${NOME_USUARIO.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, "")}"`;

if (!NOME_USUARIO) {
  document.getElementById("telaBloqueio").style.display = "flex";
} else {
  document.getElementById("telaBloqueio").style.display = "none";
  document.getElementById("conteudo").style.display = "block";

  const NOME_BUSCA = NOME_USUARIO.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, "");

  let mesAtual = new Date().getMonth() + 1;
  let anoAtual = new Date().getFullYear();
  let batalhasMes = [];

  const NOMES_MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const ABREV_SEMANA = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];

  // 📖 CARREGA BATALHAS
  async function carregarBatalhas() {
    try {
      const res = await fetch(`${LINK}?mes=${mesAtual}&ano=${anoAtual}`);
      const dados = await res.json();
      batalhasMes = dados.batalhas || [];
      
      // 🔍 MOSTRA OS NOMES DA PLANILHA PRA COMPARAR
      const nomesStreamers = [...new Set(batalhasMes.map(b => b.streamer).filter(Boolean))].slice(0,8);
      caixa.innerHTML += `<br>📋 <strong>Streamers na planilha:</strong><br>• ${nomesStreamers.join("<br>• ")}`;
      
    } catch (e) {
      caixa.innerHTML += `<br>❌ <strong>Erro:</strong> ${e}`;
      batalhasMes = [];
    }
    renderizarCalendario();
    renderizarAgendas();
  }

  function normalizarNome(nome) {
    if (!nome) return "";
    return nome.toString().trim().toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/\s+/g, "");
  }

  function ehMinhaBatalha(b) {
    const s = normalizarNome(b.streamer);
    const o = normalizarNome(b.oponente);
    const eEu = s === NOME_BUSCA || o === NOME_BUSCA;
    
    const sit = (b.situacao || "").toUpperCase();
    const ok = sit.includes("CONFIRMADO") || sit.includes("CONFIRMADA") ||
               sit.includes("CAMPANHA") || sit.includes("FALTA OPONENTE");
    return eEu && ok;
  }

  function renderizarCalendario() {
    document.getElementById("nomeMes").textContent = `${NOMES_MESES[mesAtual-1].toUpperCase()} ${anoAtual}`;
    const cal = document.getElementById("calendario");
    cal.innerHTML = "";
    
    const primeiroDia = new Date(anoAtual, mesAtual-1, 1).getDay();
    const totalDias = new Date(anoAtual, mesAtual, 0).getDate();

    for (let i = 0; i < primeiroDia; i++) cal.innerHTML += `<div class="dia vazio"></div>`;

    for (let dia = 1; dia <= totalDias; dia++) {
      const dataAlvo = `${anoAtual}-${String(mesAtual).padStart(2,"0")}-${String(dia).padStart(2,"0")}`;
      const bd = batalhasMes.filter(b => b.data && b.data.substring(0,10) === dataAlvo);
      
      let classe = "disponivel";
      if (bd.length > 0) {
        const sts = bd.map(b => (b.situacao || "").toUpperCase());
        if (sts.some(x => x.includes("DOMINGO") || x.includes("FERIADO"))) classe = "domingo";
        else if (sts.some(x => x.includes("CAMPANHA"))) classe = "campanha";
        else if (sts.some(x => x.includes("FALTA OPONENTE"))) classe = "falta-oponente";
        else if (sts.some(x => x.includes("CONFIRMADO") || x.includes("CONFIRMADA"))) classe = "confirmado";
      }

      cal.innerHTML += `<div class="dia ${classe}">
        <span class="dia-num">${dia}</span>
        <span class="dia-nome">${ABREV_SEMANA[new Date(anoAtual, mesAtual-1, dia).getDay()]}</span>
      </div>`;
    }
  }

  function renderizarAgendas() {
    const minhas = batalhasMes.filter(ehMinhaBatalha);
    
    document.getElementById("minhasBatalhas").innerHTML = minhas.length 
      ? minhas.map(b => gerarItem(b)).join("")
      : `<div class="sem-batalha">Nenhuma batalha encontrada para você.<br><small>Verifique o nome na caixinha acima!</small></div>`;

    document.getElementById("contadorGeral").textContent = `Total: ${batalhasMes.length} batalhas`;
    document.getElementById("todasBatalhas").innerHTML = batalhasMes.length
      ? batalhasMes.map(b => gerarItem(b)).join("")
      : `<div class="sem-batalha">Nenhuma batalha agendada.</div>`;
  }

  function gerarItem(b) {
    const data = b.data ? b.data.split("-").reverse().join("/") : "Sem data";
    let cor = "#7a8ba8", icone = "📌";
    const s = (b.situacao || "").toUpperCase();
    if (s.includes("FALTA OPONENTE")) { cor = "#00a8ff"; icone = "⏳"; }
    else if (s.match(/CONFIRMADA?/)) { cor = "#f0f0f0"; icone = "✅"; }
    else if (s.includes("CAMPANHA")) { cor = "#ffd700"; icone = "📢"; }
    else if (s.includes("DISPONÍVEL")) { cor = "#00ff9c"; icone = "✅"; }

    return `<div class="item-batalha" style="border-color:${cor}">
      <strong>${icone} ${data}</strong> — ${b.situacao || "Disponível"}<br>
      <small>${b.streamer || "-"} vs ${b.oponente || "-"}${b.hold ? ` · Hold: ${b.hold}` : ""}</small>
    </div>`;
  }

  document.getElementById("btnAnterior").onclick = () => {
    mesAtual--; if (mesAtual < 1) { mesAtual = 12; anoAtual--; }
    carregarBatalhas();
  };
  document.getElementById("btnProximo").onclick = () => {
    mesAtual++; if (mesAtual > 12) { mesAtual = 1; anoAtual++; }
    carregarBatalhas();
  };

  window.onload = carregarBatalhas;
}
</script>
</body>
</html>
