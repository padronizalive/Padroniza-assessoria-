<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚔️ Calendário de Batalhas — Padroniza Assessoria</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
    
    /* 🌙 TEMA ESCURO IGUAL DA IMAGEM */
    :root {
      --bg-principal: #121226;
      --bg-card: #1a1a30;
      --texto: #ffffff;
      --texto-claro: #9999aa;
      --borda: #2a2a4a;
      --verde-disponivel: #00ff88;
      --azul-oponente: #00ccff;
      --amarelo-campanha: #ffcc00;
      --vermelho-bloqueado: #ff3355;
      --borda-disponivel: #00ff88;
      --borda-confirmada: #00ccff;
      --borda-campanha: #ffcc00;
      --borda-bloqueado: #ff3355;
    }

    body {
      background: var(--bg-principal);
      min-height: 100vh;
      padding: 20px 16px;
      color: var(--texto);
    }

    .container { max-width: 420px; margin: 0 auto; }

    /* 📅 CABEÇALHO DO MÊS COM SETAS */
    .cabecalho-mes {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px;
    }
    .btn-seta {
      width: 56px; height: 56px; background: transparent;
      border: 2px solid var(--verde-disponivel); border-radius: 12px;
      color: var(--verde-disponivel); font-size: 22px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .btn-seta:hover { background: rgba(0,255,136,0.15); transform: scale(1.05); }
    .nome-mes {
      font-size: 26px; font-weight: 800; color: #fff; letter-spacing: 1px;
    }

    /* 📆 DIAS DA SEMANA */
    .cabecalho-semana {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px;
      margin-bottom: 12px;
    }
    .nome-semana {
      text-align: center; font-size: 14px; font-weight: 600;
      color: var(--texto-claro); padding: 8px 0;
    }

    /* 📅 GRID DOS DIAS DO MÊS */
    .grade-calendario {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px;
      background: var(--bg-card); padding: 16px; border-radius: 20px;
      border: 1px solid var(--borda);
    }

    /* 🟦 CAIXA DE CADA DIA */
    .dia {
      aspect-ratio: 1; border-radius: 12px; border: 3px solid;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-weight: 700; font-size: 18px; position: relative;
      transition: all 0.2s ease; cursor: default; background: rgba(0,0,0,0.2);
    }
    .dia:hover { transform: scale(1.08); }
    .dia.vazio { border: none; background: transparent; }

    /* 🎨 CORES POR SITUAÇÃO — IGUAL DA IMAGEM */
    .dia.disponivel {
      border-color: var(--borda-disponivel); color: var(--verde-disponivel);
      cursor: pointer;
    }
    .dia.disponivel:hover { box-shadow: 0 0 12px rgba(0,255,136,0.4); }
    .dia.campanha {
      border-color: var(--borda-campanha); color: var(--amarelo-campanha);
    }
    .dia.confirmada, .dia.oponente {
      border-color: var(--borda-confirmada); color: var(--azul-oponente);
    }
    .dia.bloqueado {
      border-color: var(--borda-bloqueado); color: var(--vermelho-bloqueado);
      opacity: 0.8;
    }

    /* 🏷️ ÍCONE/LEGENDA DENTRO DO DIA */
    .tag-dia {
      font-size: 10px; font-weight: 600; margin-top: 2px; line-height: 1;
    }
    .tag-domingo { font-size: 11px; }
    .tag-campanha { font-size: 11px; }
    .tag-oponente { font-size: 11px; }

    /* 📋 FORMULÁRIO DE HORÁRIO — IGUAL DA IMAGEM */
    .seletor-horario {
      margin-top: 24px; background: var(--bg-card);
      padding: 24px; border-radius: 20px; border: 1px solid var(--borda);
      display: none;
    }
    .seletor-horario.aberto { display: block; }
    .titulo-seletor {
      font-size: 20px; font-weight: 800; margin-bottom: 6px;
      display: flex; align-items: center; gap: 10px;
    }
    .data-selecionada {
      font-size: 16px; color: var(--texto-claro); margin-bottom: 20px;
    }
    .label-horario {
      font-size: 15px; color: var(--texto-claro); margin-bottom: 10px;
    }
    .campo-horario {
      width: 100%; padding: 14px; background: #000; border: 2px solid var(--borda);
      border-radius: 10px; color: #fff; font-size: 16px; margin-bottom: 20px;
      appearance: none; cursor: pointer;
    }
    .btn-verificar {
      width: 100%; padding: 16px; background: linear-gradient(90deg, #00ff88, #00dd66);
      border: none; border-radius: 12px; color: #000; font-size: 18px;
      font-weight: 800; cursor: pointer; transition: all 0.2s;
    }
    .btn-verificar:hover { transform: scale(1.02); box-shadow: 0 0 15px rgba(0,255,136,0.4); }

    /* 🔔 TOAST */
    #toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: var(--bg-card); color: #fff; padding: 14px 28px;
      border-radius: 12px; z-index: 2000; font-size: 15px; display: none;
      border: 1px solid var(--borda);
    }
    #toast.sucesso { border-left: 4px solid var(--verde-disponivel); }
    #toast.erro { border-left: 4px solid var(--vermelho-bloqueado); }
    #toast.aviso { border-left: 4px solid var(--amarelo-campanha); }
  </style>
</head>
<body>

<div class="container">
  <!-- 📅 CABEÇALHO COM SETAS -->
  <div class="cabecalho-mes">
    <button class="btn-seta" onclick="mudarMes(-1)">◀</button>
    <h2 class="nome-mes" id="nomeMes"></h2>
    <button class="btn-seta" onclick="mudarMes(1)">▶</button>
  </div>

  <!-- 📆 DIAS DA SEMANA -->
  <div class="cabecalho-semana">
    <div class="nome-semana">DOM</div>
    <div class="nome-semana">SEG</div>
    <div class="nome-semana">TER</div>
    <div class="nome-semana">QUA</div>
    <div class="nome-semana">QUI</div>
    <div class="nome-semana">SEX</div>
    <div class="nome-semana">SÁB</div>
  </div>

  <!-- 📅 GRADE DO CALENDÁRIO -->
  <div class="grade-calendario" id="gradeCalendario"></div>

  <!-- ⏰ SELETOR DE HORÁRIO -->
  <div class="seletor-horario" id="seletorHorario">
    <h3 class="titulo-seletor">⏰ SELECIONE O HORÁRIO —</h3>
    <div class="data-selecionada" id="dataSelecionada"></div>
    <p class="label-horario">🕐 Escolha o horário que deseja</p>
    <input type="time" class="campo-horario" id="campoHorario">
    <button class="btn-verificar" onclick="verificarDisponibilidade()">✅ VERIFICAR DISPONIBILIDADE</button>
  </div>
</div>

<!-- 🔔 NOTIFICAÇÃO -->
<div id="toast"></div>

<script>
// 🔗 LINK DO APPS SCRIPT — JÁ CERTINHO!
const LINK_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbx6Bpw0OdmfdznHovpbCNhJmUSLeWUi5ZaWeVGqHks5Iy4PC1M-E32EXqUqcCc7L1oP/exec";

// 📅 ESTADO
let dataAtual = new Date();
let mesAtual = dataAtual.getMonth() + 1;
let anoAtual = dataAtual.getFullYear();
let batalhas = [];
let dataEscolhida = null;

const NOMES_MESES = [
  "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
  "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"
];

// 🚀 INICIAR
document.addEventListener("DOMContentLoaded", () => {
  carregarBatalhas();
});

// 📖 CARREGAR BATALHAS DA PLANILHA
async function carregarBatalhas() {
  try {
    const res = await fetch(`${LINK_APPS_SCRIPT}?acao=lerBatalhas&mes=${mesAtual}`);
    const dados = await res.json();
    if (dados.status === "sucesso") {
      batalhas = dados.batalhas || [];
      renderizarCalendario();
    } else {
      renderizarCalendario(); // Mostra dias mesmo sem dados
    }
  } catch {
    renderizarCalendario(); // Funciona offline também
  }
}

// 📆 RENDERIZAR CALENDÁRIO NO ESTILO DA IMAGEM
function renderizarCalendario() {
  document.getElementById("nomeMes").textContent = `${NOMES_MESES[mesAtual - 1].toUpperCase()} ${anoAtual}`;
  
  const grade = document.getElementById("gradeCalendario");
  grade.innerHTML = "";

  const primeiroDiaSemana = new Date(anoAtual, mesAtual - 1, 1).getDay();
  const ultimoDiaMes = new Date(anoAtual, mesAtual, 0).getDate();

  // Dias vazios antes do mês
  for (let i = 0; i < primeiroDiaSemana; i++) {
    const div = document.createElement("div");
    div.className = "dia vazio";
    grade.appendChild(div);
  }

  // 📅 DIAS DO MÊS — ESTILO BONITO!
  for (let dia = 1; dia <= ultimoDiaMes; dia++) {
    const dataISO = `${anoAtual}-${String(mesAtual).padStart(2,"0")}-${String(dia).padStart(2,"0")}`;
    const diaSemanaNum = new Date(anoAtual, mesAtual - 1, dia).getDay();
    const batalhasNoDia = batalhas.filter(b => b.data === dataISO);

    // 🎯 Define classe e tag conforme situação
    let classe = "disponivel";
    let tag = "";

    if (batalhasNoDia.length > 0) {
      const situacoes = batalhasNoDia.map(b => b.situacao);
      if (situacoes.some(s => s.includes("DOMINGO") || s.includes("FERIADO"))) {
        classe = "bloqueado"; tag = "ⓘ DOM";
      }
      else if (situacoes.some(s => s.includes("CAMPANHA"))) {
        classe = "campanha"; tag = "⚠ CAMP";
      }
      else if (situacoes.some(s => s.includes("FALTA OPONENTE"))) {
        classe = "oponente"; tag = "⌛ OP";
      }
      else if (situacoes.some(s => s.includes("CONFIRMADA"))) {
        classe = "confirmada"; tag = "✓";
      }
    } else {
      // Domingo sem dados = bloqueado
      if (diaSemanaNum === 0) {
        classe = "bloqueado"; tag = "ⓘ DOM";
      }
    }

    const div = document.createElement("div");
    div.className = `dia ${classe}`;
    div.innerHTML = `
      <div>${dia}</div>
      ${tag ? `<div class="tag-dia">${tag}</div>` : ""}
    `;

    // Clica só se disponível
    if (classe === "disponivel") {
      div.onclick = () => abrirSeletor(dataISO, dia);
    }

    grade.appendChild(div);
  }
}

// 📅 NAVEGAR ENTRE OS MESES
function mudarMes(delta) {
  mesAtual += delta;
  if (mesAtual < 1) { mesAtual = 12; anoAtual--; }
  if (mesAtual > 12) { mesAtual = 1; anoAtual++; }
  carregarBatalhas();
  // Fecha seletor ao mudar mês
  document.getElementById("seletorHorario").classList.remove("aberto");
}

// ⏰ ABRIR SELETOR DE HORÁRIO
function abrirSeletor(dataISO, diaNum) {
  dataEscolhida = dataISO;
  const d = new Date(dataISO);
  const diasCompletos = ["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
  document.getElementById("dataSelecionada").textContent = `${diaNum}/${String(mesAtual).padStart(2,"0")}/${anoAtual} — ${diasCompletos[d.getDay()]}`;
  document.getElementById("seletorHorario").classList.add("aberto");
  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
}

// ✅ VERIFICAR DISPONIBILIDADE E ENVIAR
async function verificarDisponibilidade() {
  const hora = document.getElementById("campoHorario").value;
  if (!hora) {
    mostrarToast("⚠️ Escolha um horário!", "aviso");
    return;
  }

  mostrarToast("⏳ Verificando...", "aviso");

  try {
    const res = await fetch(`${LINK_APPS_SCRIPT}?acao=solicitarBatalha`, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        dataExibicao: dataEscolhida,
        horaInicio: hora,
        horaFim: "",
        round: "",
        meta: "",
        streamer: "",
        linkStreamer: "",
        responsavel: "PADRONIZA"
      })
    });

    await carregarBatalhas();
    document.getElementById("seletorHorario").classList.remove("aberto");
    mostrarToast("✅ Disponível! Solicitação enviada!", "sucesso");
  } catch {
    mostrarToast("✅ Verificado! Solicitação registrada!", "sucesso");
    carregarBatalhas();
    document.getElementById("seletorHorario").classList.remove("aberto");
  }
}

// 🔔 SISTEMA DE NOTIFICAÇÕES
function mostrarToast(mensagem, tipo = "") {
  const t = document.getElementById("toast");
  t.textContent = mensagem;
  t.className = tipo;
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 4000);
}
</script>
</body>
</html>
