<!-- BOTÃO DE AGENDAR BATALHA -->
<button class="btn-acao btn-verde" style="
  background:linear-gradient(135deg,#00ff9c,#00cc7d);
  color:#000;
  font-weight:bold;
  font-size:18px;
  padding:16px;
  border-radius:14px;
  border:none;
  width:100%;
  cursor:pointer;
  box-shadow:0 6px 20px rgba(0,255,156,0.35);
  margin-top:25px;
  transition:all 0.3s ease;
" onmouseover="this.style.transform='translateY(-3px)';this.style.boxShadow='0 10px 30px rgba(0,255,156,0.5)'"
onmouseout="this.style.transform='';this.style.boxShadow='0 6px 20px rgba(0,255,156,0.35)'"
onclick="irParaAgendarBatalha()">
  ⚔️ AGENDAR BATALHA OFICIAL
</button>
