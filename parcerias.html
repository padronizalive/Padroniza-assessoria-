<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Encontre Seu Oponente | Padroniza Assessoria</title>
<style>
:root{--fundo:#0b1020;--painel:#11182c;--painel2:#17213a;--verde:#34d399;--amarelo:#ffc857;--vermelho:#ef4444;--rosa:#ff3d81;--roxo:#7457ff;--azul:#3b82f6;--texto:#f7f9ff;--cinza:#a9b4cb}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:var(--fundo);color:var(--texto);min-height:100vh;padding:20px}
.container{max-width:900px;margin:0 auto}
header{text-align:center;margin-bottom:30px}
header h1{font-size:1.8rem;margin-bottom:8px}
header p{color:var(--cinza)}
.tabs{display:flex;gap:10px;margin-bottom:25px;flex-wrap:wrap}
.tab{flex:1;min-width:220px;padding:15px 20px;background:var(--painel);border:none;color:var(--texto);border-radius:12px;cursor:pointer;font-size:1rem;transition:all .3s;text-align:center}
.tab.active{background:var(--verde);color:#000;font-weight:bold}
.tab:hover{transform:translateY(-2px)}
.tab-content{display:none}
.tab-content.active{display:block}
.card{background:var(--painel);padding:25px;border-radius:16px;margin-bottom:20px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.card h2{font-size:1.4rem;margin-bottom:20px;color:var(--verde)}
.form-group{margin-bottom:15px}
.form-group label{display:block;margin-bottom:6px;color:var(--cinza);font-size:.95rem}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px;background:var(--painel2);border:1px solid transparent;border-radius:8px;color:var(--texto);font-size:1rem;outline:none;transition:border .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--verde)}
button.btn{width:100%;padding:14px;background:var(--verde);color:#000;border:none;border-radius:10px;font-size:1rem;font-weight:bold;cursor:pointer;transition:all .3s;margin-top:10px}
button.btn:hover{transform:translateY(-2px);box-shadow:0 6px 15px rgba(52,211,153,.3)}
button.btn.azul{background:var(--azul)}
button.btn.azul:hover{box-shadow:0 6px 15px rgba(59,130,246,.3)}
.lista-vazia{text-align:center;padding:40px;color:var(--cinza)}
.solicitacao{background:var(--painel2);padding:18px;border-radius:12px;margin-bottom:12px;border-left:4px solid var(--azul)}
.solicitacao h3{font-size:1.1rem;margin-bottom:10px;color:var(--amarelo)}
.solicitacao p{margin-bottom:6px;font-size:.95rem}
.solicitacao p span{color:var(--cinza)}
.erro{background:rgba(239,68,68,.1);border:1px solid var(--vermelho);padding:15px;border-radius:10px;color:var(--vermelho);text-align:center;margin-top:20px}
.sucesso{background:rgba(52,211,153,.1);border:1px solid var(--verde);padding:15px;border-radius:10px;color:var(--verde);text-align:center;margin-top:20px}
.voltar{display:inline-block;margin-bottom:20px;color:var(--azul);text-decoration:none;font-size:.95rem}
.voltar:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="container">
<a href="../index.html" class="voltar">← Voltar ao Portal</a>

<header>
<h1>⚔️ Encontre Seu Oponente</h1>
<p>Agendamento gratuito de batalhas entre agências — conecte e batalhe!</p>
</header>

<div class="tabs">
<button class="tab active" data-tab="cadastrar">📝 Cadastrar Desafio</button>
<button class="tab" data-tab="lista">🔍 Encontre Seu Oponente</button>
</div>

<!-- ABA CADASTRAR DESAFIO -->
<div class="tab-content active" id="cadastrar">
<div class="card">
<h2>Solicitar Batalha</h2>
<form id="formDesafio">

<div class="form-group">
<label>Nome da Sua Agência *</label>
<input type="text" id="agencia" placeholder="Ex: Padroniza Assessoria" required>
</div>

<div class="form-group">
<label>Nome do Streamer *</label>
<input type="text" id="streamer" placeholder="Nome do streamer que vai batalhar" required>
</div>

<div class="form-group">
<label>Link do Perfil (TikTok/Kako) *</label>
<input type="url" id="perfil" placeholder="https://..." required>
</div>

<div class="form-group">
<label>WhatsApp da Agência *</label>
<input type="tel" id="whatsapp" placeholder="(DD) 9XXXX-XXXX" required>
</div>

<div class="form-group">
<label>Meta de Diamantes</label>
<input type="text" id="meta" placeholder="Ex: 10k, 50k, 100k">
</div>

<div class="form-group">
<label>Quantidade de Rodadas</label>
<input type="text" id="rodada" placeholder="Ex: 1, 2, 3">
</div>

<div class="form-group">
<label>Data Desejada *</label>
<input type="date" id="data" required>
</div>

<div class="form-group">
<label>Horário Desejado *</label>
<input type="time" id="horario" required>
</div>

<div class="form-group">
<label>Observação (opcional)</label>
<textarea id="observacao" rows="3" placeholder="Informações adicionais..."></textarea>
</div>

<button type="submit" class="btn">📤 Enviar Solicitação</button>
<div id="mensagem"></div>
</form>
</div>
</div>

<!-- ABA ENCONTRE SEU OPONENTE -->
<div class="tab-content" id="lista">
<div class="card">
<h2>🎯 Oponentes Disponíveis</h2>
<button class="btn azul" id="btnAtualizar">🔄 Atualizar Lista</button>
<div id="listaDesafios">
<div class="lista-vazia">Clique em "Atualizar Lista" para ver os oponentes disponíveis...</div>
</div>
</div>
</div>

</div>

<script>
const scriptUrl = "https://script.google.com/macros/s/AKfycbxQpjyk6IcrPTLvSzv70_0AHvoHWENX7MPEy1nIMVL8OgkPDtpln_IYo26oXGuquwOHug/exec";

// Tabs
document.querySelectorAll('.tab').forEach(tab => {
tab.addEventListener('click', () => {
document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
tab.classList.add('active');
document.getElementById(tab.dataset.tab).classList.add('active');
});
});

// Enviar formulário
document.getElementById('formDesafio').addEventListener('submit', async e => {
e.preventDefault();
const mensagem = document.getElementById('mensagem');
mensagem.innerHTML = '';

const dados = {
agencia: document.getElementById('agencia').value.trim(),
streamer: document.getElementById('streamer').value.trim(),
perfil: document.getElementById('perfil').value.trim(),
whatsapp: document.getElementById('whatsapp').value.trim(),
meta: document.getElementById('meta').value.trim() || 'A combinar',
rodada: document.getElementById('rodada').value.trim() || 'A combinar',
data: document.getElementById('data').value,
horario: document.getElementById('horario').value,
observacao: document.getElementById('observacao').value.trim() || '—'
};

try {
const res = await fetch(scriptUrl, {
method: 'POST',
mode: 'no-cors',
headers: {'Content-Type': 'application/json'},
body: JSON.stringify(dados)
});
mensagem.innerHTML = `<div class="sucesso">✅ Solicitação enviada! Agora é só esperar outra agência te encontrar e chamar! 🎉</div>`;
document.getElementById('formDesafio').reset();
} catch(erro) {
mensagem.innerHTML = `<div class="erro">❌ Erro ao enviar. Tente novamente.</div>`;
}
});

// Carregar lista
document.getElementById('btnAtualizar').addEventListener('click', carregarLista);
carregarLista();

async function carregarLista() {
const container = document.getElementById('listaDesafios');
container.innerHTML = '<div class="lista-vazia">🔄 Carregando oponentes...</div>';

try {
const res = await fetch(scriptUrl + "?acao=listar");
const json = await res.json();
const desafios = json.dados || [];

if(desafios.length === 0) {
container.innerHTML = '<div class="lista-vazia">📭 Nenhum oponente cadastrado ainda. Seja o primeiro a cadastrar! ⚔️</div>';
return;
}

container.innerHTML = desafios.map(d => `
<div class="solicitacao">
<h3>🎤 ${d.streamer}</h3>
<p><span>Agência:</span> ${d.agencia}</p>
<p><span>Perfil:</span> <a href="${d.perfil}" target="_blank" style="color:var(--azul)">🔗 Abrir perfil</a></p>
<p><span>Chamar para batalhar:</span> <a href="https://wa.me/${d.whatsapp.replace(/\D/g,'')}" target="_blank" style="color:var(--verde);font-weight:bold">💬 WhatsApp da Agência</a></p>
<p><span>Meta:</span> ${d.meta} | <span>Rodadas:</span> ${d.rodada}</p>
<p><span>Disponível:</span> ${formatarData(d.data)} às ${d.horario}</p>
${d.observacao !== '—' ? `<p><span>Obs:</span> ${d.observacao}</p>` : ''}
</div>
`).join('');

} catch(e) {
container.innerHTML = `<div class="erro">⚠️ Não foi possível carregar. Tente novamente.</div>`;
}
}

function formatarData(dataStr) {
if(!dataStr) return "A combinar";
const [ano,mes,dia] = dataStr.split('-');
return `${dia}/${mes}/${ano}`;
}
</script>
</body>
</html>
