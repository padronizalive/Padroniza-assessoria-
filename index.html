<script>
const ID_PLANILHA = '1R9eUsqF4kA0y22ryMUIsvGolBfk3-XwZ5R-RVpBiZA4';
const ADMIN_EMAIL = 'padronizaassessoria@gmail.com';
const ADMIN_SENHA = 'agency2026.';
let perfil = '';
let dados = {};
let dadosPlanilha = [];

document.addEventListener('DOMContentLoaded', async () => {
  await carregarDadosPlanilha();
});

function escolher(tipo){
  document.querySelectorAll('.tipo-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`btn-${tipo}`).classList.add('active');
  document.getElementById('form-agenciado').style.display = tipo === 'agenciado' ? 'block' : 'none';
  document.getElementById('form-visitante').style.display = tipo === 'visitante' ? 'block' : 'none';
  document.getElementById('form-admin').style.display = 'none';
}

function mostrarAdmin(){
  document.getElementById('form-agenciado').style.display='none';
  document.getElementById('form-visitante').style.display='none';
  document.getElementById('form-admin').style.display='block';
}

async function carregarDadosPlanilha(){
  try{
    const url = `https://docs.google.com/spreadsheets/d/${ID_PLANILHA}/gviz/tq?tqx=out:json&headers=1&_=${Date.now()}`;
    const res = await fetch(url, { cache: 'no-store' });
    const texto = await res.text();
    const json = JSON.parse(texto.substr(47).slice(0,-2));
    
    dadosPlanilha = json.table.rows.map(linha => ({
      usuario: (linha.c[0]?.v || '').trim().toLowerCase(),
      status: (linha.c[1]?.v || 'Pendente').trim(),
      data: linha.c[2]?.v || new Date().toLocaleString('pt-BR'),
      tiktok_perfil: linha.c[3]?.v || '',
      tiktok_live: linha.c[4]?.v || '',
      kako_perfil: linha.c[5]?.v || '',
      kako_live: linha.c[6]?.v || '',
      capa: linha.c[7]?.v || '',
      esta_ao_vivo: String(linha.c[8]?.v || 'false').toLowerCase() === 'true',
      assinante: String(linha.c[9]?.v || 'false').toLowerCase() === 'true',
      tem_treinamento: String(linha.c[10]?.v || 'false').toLowerCase() === 'true'
    })).filter(item => item.usuario);
    
  }catch(e){
    console.log('Carregamento padrão ativado');
  }
}

async function verificarAcesso(){
  let usuario = document.getElementById('usuario-agen').value.trim().toLowerCase();
  usuario = usuario.replace(/^@/, '').replace(/\s+/g, '');
  
  if(!usuario) return alert('⚠️ Digite seu usuário!');
  
  await carregarDadosPlanilha();
  
  const aprovado = dadosPlanilha.some(i => i.usuario === usuario && i.status.trim() === 'Aprovado');
  
  if(!aprovado){
    return alert('⚠️ Seu acesso ainda não foi aprovado! Verifique o nome exato ou aguarde a confirmação.');
  }
  
  dados.usuario = usuario;
  perfil = 'agenciado';
  document.getElementById('loginPage').style.display='none';
  document.getElementById('mainPage').style.display='block';
  atualizarTela();
}

function entrar(tipo){
  perfil = tipo;
  if(tipo === 'admin'){
    let e = document.getElementById('email-admin').value.trim();
    let s = document.getElementById('senha-admin').value;
    if(e !== ADMIN_EMAIL || s !== ADMIN_SENHA) return alert('❌ Dados de admin incorretos!');
  } else if(tipo === 'visitante'){
    dados.nome = document.getElementById('nome-vis').value.trim();
    if(!dados.nome) return alert('Digite seu nome!');
  }
  document.getElementById('loginPage').style.display='none';
  document.getElementById('mainPage').style.display='block';
  atualizarTela();
}

function atualizarTela(){
  const tag = document.getElementById('tag-perfil');
  const msg = document.getElementById('mensagem-inicio');
  const botaoAdm = document.getElementById('botao-admin');

  if(perfil === 'agenciado'){
    tag.innerText = '🟢 AGENCIADO'; tag.className = 'perfil-tag tag-agenciado';
    msg.innerHTML = `Olá <strong>${dados.usuario}</strong>! Você tem acesso GRATUITO e PERMANENTE a todos os serviços e treinamento!`;
  } else if(perfil === 'visitante'){
    tag.innerText = '🔵 VISITANTE'; tag.className = 'perfil-tag tag-visitante';
    msg.innerHTML = `Olá <strong>${dados.nome}</strong>! Conheça nossos valores: Pacote Completo R$39,99/mês + Treinamento Permanente por apenas R$9,99 uma vez!`;
  } else {
    tag.innerText = '⚙ ADMIN'; tag.className = 'perfil-tag tag-admin';
    msg.innerHTML = `Bem-vindo de volta! Controle total da agência.`; botaoAdm.style.display = 'inline-block';
  }
}

function copiarPix(){
  const codigo = document.getElementById('codigoPix').innerText.trim();
  navigator.clipboard.writeText(codigo).then(()=>alert('✅ Código copiado!'));
}

function sair(){
  perfil = ''; dados = {};
  document.getElementById('mainPage').style.display='none';
  document.getElementById('loginPage').style.display='block';
  document.querySelectorAll('.tipo-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('form-agenciado').style.display='none';
  document.getElementById('form-visitante').style.display='none';
  document.getElementById('form-admin').style.display='none';
}
</script>
