<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste Escolha de Perfil</title>
<style>
body{background:#0b1020;color:white;font-family:Arial;padding:30px}
.container{max-width:400px;margin:0 auto;background:#11182c;padding:30px;border-radius:15px;border:1px solid #293653}
h1{color:#ff3d81;text-align:center;margin-bottom:20px}
.botoes{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:20px}
button{padding:15px;border-radius:10px;border:none;font-weight:bold;cursor:pointer;font-size:16px}
.btn-agenciado{background:#34d399;color:black}
.btn-visitante{background:#3b82f6;color:white}
</style>
</head>
<body>
<div class="container">
  <h1>PADRONIZA ASSESSORIA</h1>
  <div class="botoes">
    <button class="btn-agenciado" onclick="alert('Você escolheu ser AGENCIADO!')">🟢 Sou Agenciado</button>
    <button class="btn-visitante" onclick="alert('Você escolheu ser VISITANTE!')">🔵 Sou Visitante</button>
  </div>
  <p style="text-align:center;color:#a9b4cb">Escolha a opção que corresponde a você</p>
</div>
</body>
</html>
