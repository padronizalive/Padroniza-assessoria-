<div id="form-agenciado" style="display:none">
  <div class="aviso agenciado">✅ Serviços grátis após confirmação de cadastro!</div>
  <div class="field">
    <label>E-mail cadastrado na agência</label>
    <input id="email-agenciado" placeholder="Digite o mesmo e-mail que passou para nós">
  </div>
  <div class="field">
    <label>Nome de usuário / ID cadastrado na agência</label>
    <input id="usuario-agenciado" placeholder="Seu nome de usuário ou ID da agência">
  </div>
  <button class="btn green" onclick="entrarComo('agenciado')">Continuar como Agenciado</button>
</div>
