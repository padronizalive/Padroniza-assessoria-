<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Padroniza+Live Assessoria | Portal Oficial</title>
<style>
:root{--fundo:#0b1020;--painel:#11182c;--painel2:#17213a;--verde:#34d399;--rosa:#ff3d81;--roxo:#7457ff;--amarelo:#ffc857;--azul:#3b82f6;--laranja:#ffc107;--texto:#f7f9ff;--cinza:#a9b4cb;--vermelho:#ef4444}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:var(--fundo);color:var(--texto);min-height:100vh;padding:15px}
.container{max-width:650px;margin:0 auto}

.logo-topo{width:280px;margin:0 auto 15px;display:flex;align-items:center;justify-content:center;background:var(--painel);border:3px solid var(--amarelo);border-radius:16px;text-align:center;padding:15px}
.logo-topo h1{font-size:26px;color:var(--amarelo);font-weight:bold;line-height:1.3;text-transform:uppercase}
.cabecalho{text-align:center;margin-bottom:20px}
.cabecalho h2{font-size:30px;color:var(--amarelo);margin-bottom:5px}
.cabecalho p{font-size:18px;color:var(--cinza)}

.botoes-principais{display:flex;flex-direction:column;gap:14px;margin-bottom:25px}
.btn-principal{padding:18px;border-radius:12px;border:none;font-weight:bold;font-size:18px;cursor:pointer;text-align:center;color:#fff;transition:0.2s}
.btn-principal:hover{transform:translateY(-2px)}
.btn-agenciado{background:linear-gradient(135deg,#22c55e,#15803d)}
.btn-visitante{background:linear-gradient(135deg,#3b82f6,#1d4ed8)}
.btn-outra-agencia{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#000}
.btn-admin{background:linear-gradient(135deg,#8b5cf6,#6d28d9)}
.btn-moedas{background:linear-gradient(135deg,#ec4899,#db2777)}

.lives-na-inicial{margin-top:30px}
.titulo-lives-inicial{text-align:center;color:var(--amarelo);font-size:22px;margin-bottom:15px}
.cartao-live{background:var(--painel2);border-radius:12px;padding:15px;margin-bottom:15px;border:1px solid #293653}
.nome-streamer{font-size:20px;font-weight:bold;color:var(--amarelo);margin-bottom:10px}
.btn-assistir{background:var(--verde);color:#fff;border:none;padding:12px 20px;border-radius:8px;font-weight:bold;font-size:16px;width:100%;margin-bottom:10px;cursor:pointer}
.capa-live{width:100%;height:180px;border-radius:8px;background:#121a30;margin-bottom:10px;display:flex;align-items:center;justify-content:center;color:var(--cinza);font-size:14px;overflow:hidden}
.capa-live img{width:100%;height:100%;object-fit:cover}
.status-ao-vivo{display:inline-block;background:var(--vermelho);color:#fff;padding:6px 12px;border-radius:6px;font-weight:bold;font-size:14px;margin-right:10px}
.plataforma-live{color:var(--verde);font-weight:bold;font-size:15px}
.sem
