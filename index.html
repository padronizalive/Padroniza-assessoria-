<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Padroniza Assessoria | Portal Oficial</title>
<style>
:root{--fundo:#0b1020;--painel:#11182c;--painel2:#17213a;--verde:#34d399;--rosa:#ff3d81;--roxo:#7457ff;--amarelo:#ffc857;--texto:#f7f9ff;--cinza:#a9b4cb;--vermelho:#ef4444}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:var(--fundo);color:var(--texto);min-height:100vh;padding:15px}
.container{max-width:600px;margin:0 auto}

.logo-topo{width:220px;height:220px;margin:0 auto 15px;display:flex;align-items:center;justify-content:center;background:var(--painel2);border-radius:12px;border:2px solid var(--amarelo);font-size:22px;font-weight:bold;color:var(--amarelo);text-align:center;padding:10px}

.cabecalho{text-align:center;margin-bottom:15px}
.cabecalho h1{font-size:26px;color:var(--amarelo)}
.cabecalho p{color:var(--cinza)}

.botoes-principais{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;position:sticky;top:10px;z-index:999;background:var(--fundo);padding:10px 0}
.btn-principal{padding:16px;border-radius:12px;border:none;font-weight:bold;font-size:17px;cursor:pointer;text-align:center;color:#fff;transition:0.2s}
.btn-principal:hover{transform:translateY(-2px)}
.btn-agenciado{background:linear-gradient(135deg,var(--verde),#16a34a)}
.btn-visitante{background:linear-gradient(135deg,#3b82f6,#2563eb)}
.btn-outra-agencia{background:linear-gradient(135deg,var(--amarelo),#f59e0b);color:#000}
.btn-admin{background:linear-gradient(135deg,var(--roxo),#4f46e5)}
.btn-moedas{background:linear-gradient(135deg,#ff6b9d,var(--rosa));font-size:15px;padding:14px;margin-top:10px}

.conteudo{display:none;background:var(--painel);border-radius:12px;padding:20px;margin-bottom:20px}
.conteudo.visivel{display:block}
.titulo-secao{text-align:center;margin-bottom:18px;color:var(--amarelo);font-size:20px}
.grupo-campo{position:relative;margin:8px 0}
.campo-form{width:100%;padding:12px 15px;border-radius:8px;border:1px solid #293653;background:#17213a;color:var(--texto);font-size:15px}
.campo-form::placeholder{color:var(--cinza)}
.btn-acao{width:100%;padding:12px;border-radius:8px;border:none;font-weight:bold;cursor:pointer;margin-top:10px;text-decoration:none;display:inline-block;text-align:center;color:#fff;font-size:16px}
.btn-verde{background:var(--verde)}
.btn-voltar{background:#293653;color:#fff;margin-top:15px}
.area-admin{background:rgba(116,87,255,0.1);border:1px solid var(--roxo);border-radius:10px;padding:15px;margin-top:20px;display:none}
</style>
</head>
<body>
<div class="container">

<div id="telaInicial">
  <div class="logo-topo">PADRONIZA<br>ASSESSORIA</div>
  <div class="cabecalho">
    <h1>PADRONIZA ASSESSORIA</h1>
    <p>Seu sucesso nas lives começa aqui!</p>
  </div>
  <div class="botoes-principais">
    <button class="btn-principal btn-agenciado" onclick="abrir('agenciado')">✅ SOU AGENCIADO PADRONIZA</button>
    <button class="btn-principal btn-visitante" onclick="abrir('visitante')">👤 SOU VISITANTE / VER LIVES</button>
    <button class="btn-principal btn-outra-agencia" onclick="abrir('outraAgencia')">🤝 SOU OUTRA AGÊNCIA</button>
    <button class="btn-principal btn-admin" onclick="abrir('admin')">🔐 ÁREA DA ADMINISTRAÇÃO</button>
    <a href="https://www.tiktok.com/coin?rc=7TGXGN69&rie=" target="_blank" class="btn-principal btn-moedas">💰 COMPRAR MOEDAS TIKTOK</a>
  </div>
</div>

<div class="conteudo" id="conteudoAdmin">
  <h2 class="titulo-secao">🔐 ÁREA DA ADMINISTRAÇÃO</h2>
  <div class="grupo-campo">
    <input type="email" class="campo-form" id="emailAdmin" placeholder="E-mail: padronizaassessoria@gmail.com">
  </div>
  <div class="grupo-campo">
    <input type="password" class="campo-form" id="senhaAdmin" placeholder="Digite sua senha">
  </div>
  <button class="btn-acao btn-verde" onclick="verificarAdmin()">🔑 ENTRAR NO PAINEL</button>
  <button class="btn-acao btn-voltar" onclick="voltar()">Voltar ao Início</button>

  <div id="painelAdmin" class="area-admin">
    <h3 style="color:var(--amarelo);text-align:center;margin-bottom:15px">⚙️ PAINEL DE CONTROLE</h3>
    <p style="text-align:center;color:var(--cinza);margin-bottom:10px">✅ Você está logado como Administrador</p>
    <button class="btn-acao btn-verde" onclick="alert('Função em desenvolvimento!')">📋 Gerenciar Agenciados</button>
    <button class="btn-acao btn-verde" onclick="alert('Função em desenvolvimento!')">⚔️ Gerenciar Batalhas</button>
    <button class="btn-acao btn-verde" onclick="alert('Função em desenvolvimento!')">⚙️ Configurações do Site</button>
    <a href="https://wa.me/556981478873" target="_blank" class="btn-acao btn-verde">💬 Falar com Suporte</a>
  </div>
</div>

<div class="conteudo" id="conteudoAgenciado"><h2 class="titulo-secao">🎉 Bem-vindo(a) parceiro(a)!</h2><button class="btn-acao btn-voltar" onclick="voltar()">Voltar</button></div>
<div class="conteudo" id="conteudoVisitante"><h2 class="titulo-secao">👤 Bem-vindo!</h2><button class="btn-acao btn-voltar" onclick="voltar()">Voltar</button></div>
<div class="conteudo" id="conteudoOutraAgencia"><h2 class="titulo-secao">🤝 Parcerias</h2><button class="btn-acao btn-voltar" onclick="voltar()">Voltar</button></div>

</div>

<script>
function abrir(id){
  document.querySelectorAll('.conteudo').forEach(c=>c.classList.remove('visivel'));
  document.getElementById('telaInicial').style.display = 'none';
  document.getElementById('conteudo'+id.charAt(0).toUpperCase()+id.slice(1)).classList.add('visivel');
}

function voltar(){
  document.querySelectorAll('.conteudo').forEach(c=>c.classList.remove('visivel'));
  document.getElementById('telaInicial').style.display = 'block';
}

function verificarAdmin(){
  const email = document.getElementById('emailAdmin').value.trim();
  const senha = document.getElementById('senhaAdmin').value.trim();
  if(email === 'padronizaassessoria@gmail.com' && senha === 'agency2026.'){
    alert('✅ Acesso liberado!');
    // Abre o painel após o aviso
    document.getElementById('painelAdmin').style.display = 'block';
    // Limpa os campos de login
    document.getElementById('emailAdmin').value = '';
    document.getElementById('senhaAdmin').value = '';
  }else{
    alert('❌ E-mail ou senha incorretos!');
  }
}
</script>
</body>
</html>
