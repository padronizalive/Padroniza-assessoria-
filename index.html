<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste Botões</title>
<style>
body{background:#0b1020;color:#fff;font-family:Arial;padding:20px;text-align:center}
button{padding:15px 30px;margin:10px;border-radius:8px;border:none;font-size:16px;font-weight:bold;cursor:pointer}
#btn-agenciado{background:#34d399;color:#000}
#btn-visitante{background:#3b82f6;color:#fff}
#form-agenciado,#form-visitante{display:none;margin-top:20px;padding:20px;background:#11182c;border-radius:12px}
</style>
</head>
<body>

<h1>PADRONIZA ASSESSORIA</h1>
<button id="btn-agenciado" onclick="escolher('agenciado')">🟢 Sou Agenciado</button>
<button id="btn-visitante" onclick="escolher('visitante')">🔵 Não Sou Agenciado</button>

<div id="form-agenciado">
  <h3>✅ Formulário de Agenciado funcionou!</h3>
  <p>Se apareceu aqui, os botões estão certos!</p>
</div>

<div id="form-visitante">
  <h3>🔵 Formulário de Visitante funcionou!</h3>
  <p>Se apareceu aqui, os botões estão certos!</p>
</div>

<script>
function escolher(tipo){
  document.getElementById('form-agenciado').style.display = tipo === 'agenciado' ? 'block' : 'none';
  document.getElementById('form-visitante').style.display = tipo === 'visitante' ? 'block' : 'none';
}
</script>

</body>
</html>
